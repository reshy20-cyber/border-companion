<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="رفيق الحدود">
<title>رفيق الحدود Border Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Border Companion: travel and residence law guide">
<meta name="theme-color" content="#0F2F52">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=El+Messiri:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone app — passport-navy header band, traveller card, content cards, fixed bottom navigation */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --ink:#0E1B2B; --muted:#475667; --line:#D5DDE7;
  --navy:#0F2F52; --navy2:#1A4573; --on-navy:#F4EEDD; --gold:#E4B649; --gold-ink:#8A6110; --tint:#E3EBF5;
  --ok:#1E7A45; --mid:#1F5FAE; --cau:#9C5F00; --no:#B3372B; --warn-bg:#FBEDE9;
  --display:"El Messiri","Readex Pro",system-ui,sans-serif;
  --body:"Readex Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08121F; --surface:#111F33; --ink:#E9EFF6; --muted:#A8B7C8; --line:#22344C;
  --navy:#0B1F38; --navy2:#16365C; --on-navy:#F4EEDD; --gold:#E9BF5A; --gold-ink:#E9BF5A; --tint:#172B45;
  --ok:#5FD08A; --mid:#7DB4F0; --cau:#E8B44A; --no:#F28474; --warn-bg:#33201C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08121F; --surface:#111F33; --ink:#E9EFF6; --muted:#A8B7C8; --line:#22344C;
  --navy:#0B1F38; --navy2:#16365C; --on-navy:#F4EEDD; --gold:#E9BF5A; --gold-ink:#E9BF5A; --tint:#172B45;
  --ok:#5FD08A; --mid:#7DB4F0; --cau:#E8B44A; --no:#F28474; --warn-bg:#33201C; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;font-weight:400;-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto}

/* header */
.top{background:linear-gradient(160deg,var(--navy2),var(--navy));color:var(--on-navy);border-bottom:3px solid var(--gold)}
.top .wrap{padding-block:12px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.top .lang{align-self:flex-end;order:-1;font-size:14px;padding:6px 14px}
.logo{width:52px;height:52px;border-radius:14px;flex:none;box-shadow:0 2px 10px rgb(0 0 0 / .25)}
.brand{min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.brand h1{font-family:var(--display);font-size:40px;margin:0;line-height:1.15;font-weight:700;letter-spacing:.01em;text-shadow:0 2px 10px rgb(0 0 0 / .25)}
.brand h1::after{content:"";display:block;width:56px;height:3px;border-radius:2px;background:var(--gold);margin:10px auto 0}
.brand p{margin:0;font-size:18px;font-weight:500;opacity:.92;line-height:1.5;max-width:22em;text-wrap:balance}
.lang{appearance:none;-webkit-appearance:none;background:rgb(255 255 255 / .12);color:var(--on-navy);border:1px solid rgb(255 255 255 / .28);border-radius:999px;padding:8px 14px;font:inherit;font-size:15px;font-weight:600;width:auto;min-height:0}
.lang option{color:#0E1B2B;background:#fff}

main.wrap{display:flex;flex-direction:column;gap:16px;padding-block:18px 24px}

/* traveller card */
.profile{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.psum{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:14px 16px;text-align:start}
.psum .badge{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--navy2);display:grid;place-items:center;flex:none}
:root[data-theme="dark"] .psum .badge{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .psum .badge{color:var(--gold)}}
.psum .txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.psum .lbl{font-size:14px;color:var(--muted);font-weight:500}
.psum .val{font-size:18px;font-weight:600}
.psum .sub{font-size:14.5px;color:var(--muted)}
.psum .edit{font-size:15px;font-weight:600;color:var(--gold-ink);display:flex;align-items:center;gap:6px}
.pbody{border-top:1px solid var(--line);padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.prow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.prow{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.holds legend{font-size:15px;color:var(--muted);font-weight:500}
select,input[type=date],input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:50px}
.holds{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.holds label{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.holds input,.chk input,.todo input{accent-color:var(--navy2);width:20px;height:20px;flex:none;margin-top:4px}

/* pickers */
.holdsbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.holdsbox summary{cursor:pointer;font-weight:600;color:var(--navy2)}
.holdsbox[open] summary{margin-bottom:10px}
:root[data-theme="dark"] .holdsbox summary{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .holdsbox summary{color:var(--gold)}}
.picker{display:flex;flex-direction:column;gap:6px}
.picker label{font-size:15px;color:var(--muted);font-weight:500}
.selwrap{position:relative;display:flex;align-items:center}
.selwrap svg{position:absolute;inset-inline-start:14px;color:var(--navy2);pointer-events:none}
html,body{max-width:100%;overflow-x:hidden}
.picker,.selwrap{min-width:0;max-width:100%}
select.big{flex:1 1 0;min-width:0;max-width:100%;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;font-size:19px;font-weight:600;background:var(--surface);border:2px solid var(--navy2);min-height:58px;padding-inline-start:46px;border-radius:14px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) select.big{border-color:var(--gold)}:root:not([data-theme="light"]) .selwrap svg{color:var(--gold)}}
:root[data-theme="dark"] select.big{border-color:var(--gold)}:root[data-theme="dark"] .selwrap svg{color:var(--gold)}

/* country hero */
.hero{background:linear-gradient(150deg,var(--navy2),var(--navy));color:var(--on-navy);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero .flag{font-size:64px;line-height:1;flex:none;filter:drop-shadow(0 3px 8px rgb(0 0 0 / .45))}
.hero h2{font-size:34px;color:#fff;text-shadow:0 1px 3px rgb(0 0 0 / .9),0 2px 14px rgb(0 0 0 / .7)}
.hero .chip{background:rgb(8 18 31 / .7);border-color:rgb(255 255 255 / .35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.hero .checked{opacity:1;align-self:center;background:rgb(8 18 31 / .7);border-radius:8px;padding:1px 10px}
.hero .row{display:flex;align-items:center;justify-content:center;gap:14px;text-align:center}
.hero{align-items:center;text-align:center}
.hero .code{font-family:var(--mono);font-weight:600;font-size:22px;letter-spacing:.14em;border:2px solid var(--gold);color:var(--gold);border-radius:10px;padding:4px 10px}
.hero h2{font-family:var(--display);font-size:30px;margin:0;line-height:1.2;text-wrap:balance}
.hero .facts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.hero .chip{font-size:18px;font-weight:600;background:rgb(255 255 255 / .1);border:1px solid rgb(255 255 255 / .22);border-radius:999px;padding:4px 12px}
.hero .chip b{font-family:var(--mono);font-weight:600}
.hero .checked{font-size:13.5px;opacity:.75}

/* status card */
.st-ok{--s:var(--ok)} .st-mid{--s:var(--mid)} .st-cau{--s:var(--cau)} .st-no{--s:var(--no)}
.mine{background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--s);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.mine h3{margin:0;font-size:15.5px;color:var(--muted);font-weight:500}
.stamp{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;color:var(--s);border:2.5px solid var(--s);border-radius:8px;padding:3px 12px;font-weight:700;font-size:17px}
.conf{font-size:15px;color:var(--muted)}
.apply{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--navy2);color:#fff;text-decoration:none;border-radius:12px;padding:13px 14px;font-weight:600;font-size:17px;margin-top:4px}
.apply svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:root[data-theme="dark"] .apply{background:var(--gold);color:#08121F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .apply{background:var(--gold);color:#08121F}}
.applynote{font-size:14px;color:var(--muted);text-align:center}
.conf.ck{color:var(--cau);font-weight:500}

/* section cards */
section.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card .h{display:flex;align-items:center;gap:10px}
.card .ic{width:38px;height:38px;border-radius:11px;background:var(--tint);color:var(--navy2);display:grid;place-items:center;flex:none}
:root[data-theme="dark"] .card .ic{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card .ic{color:var(--gold)}}
.card h3{margin:0;font-size:19px;font-weight:600}
.card.warn{background:var(--warn-bg);border-color:transparent}
.card.warn .ic{background:var(--no);color:#fff}
.card ul{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.card li::marker{color:var(--gold-ink)}
.src{font-size:15px;color:var(--muted)}
.src a{color:var(--navy2);font-weight:600;word-break:break-word}
:root[data-theme="dark"] .src a{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .src a{color:var(--gold)}}
.sos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sos div{border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;background:var(--bg)}
.sos span{font-size:14.5px;color:var(--muted)}
.sos b{font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--no)}
.disclaimer{font-size:15px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin:0}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alerts:empty{display:none}
.alert{border-inline-start:5px solid var(--s);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:16px;font-weight:500}

/* trips & dates */
.view{display:flex;flex-direction:column;gap:16px}
.form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.chk{display:flex;gap:10px;align-items:center;font-size:16px;color:var(--ink)!important;height:100%;padding-top:22px}
@media (max-width:460px){.chk{padding-top:0}}
.primary{background:var(--navy2);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:600;font-size:17px}
.list{display:flex;flex-direction:column;gap:14px}
.item{background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--s);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.item .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.item h3{margin:0;font-family:var(--display);font-size:22px}
.pill{background:var(--s);color:#fff;font-weight:600;font-size:15px;border-radius:999px;padding:3px 12px}
:root[data-theme="dark"] .pill{color:#08121F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill{color:#08121F}}
.meta{font-size:15px;color:var(--muted)}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.todo label{display:flex;gap:10px;align-items:flex-start}
.todo input:checked+span{color:var(--muted);text-decoration:line-through}
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:15px;font-weight:500}
.ghost.del{color:var(--no)}
.days{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--s);font-variant-numeric:tabular-nums}
.note{font-size:15px;padding:9px 12px;border-radius:10px;background:var(--warn-bg)}
#st_i{margin:-6px 0 0}
.sth{margin:0;font-family:var(--display);font-size:22px}
.stayres{border-inline-start:6px solid var(--s);background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.stayres .sh{font-size:19px;font-weight:700;color:var(--s)}
.stayres .ghost{margin-top:6px}
.whatif{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg)}
.whatif summary{cursor:pointer;font-weight:600;font-size:17px}
.whatif[open] summary{margin-bottom:6px}
.whatif ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.disclaimer.privacy{border-top:0;padding-top:0;margin-top:-6px}
.bkim{display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:600;flex:1;text-align:center}
.emptyv{color:var(--muted);text-align:center;padding:26px 14px;border:2px dashed var(--line);border-radius:16px}

/* bottom navigation */
nav.tabs{position:fixed;inset:auto 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgb(14 27 43 / .08);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;font-size:14.5px;font-weight:600;color:var(--muted);position:relative}
nav.tabs button svg.i{width:26px;height:26px}
nav.tabs button[aria-selected="true"]{color:var(--navy2)}
:root[data-theme="dark"] nav.tabs button[aria-selected="true"]{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{color:var(--gold)}}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;width:36px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<header class="top"><div class="wrap pad">
  <div class="brand"><h1 id="appName">رفيق الحدود</h1><p id="tagline"></p></div>
  <select class="lang" id="langSel" aria-label="Language"><option value="ar">العربية</option><option value="en">English</option><option value="fr">Français</option><option value="de">Deutsch</option></select>
</div></header>

<main class="wrap pad">
  <div id="alerts" class="alerts"></div>

  <div id="v-countries" class="view">
    <div class="picker"><label for="nat" id="natL"></label>
      <div class="selwrap"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M9 16h6"/></svg><select id="nat" class="big"></select></div>
    </div>
    <div class="picker"><label for="purpose" id="purL"></label>
      <div class="selwrap"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg><select id="purpose" class="big"></select></div>
    </div>
    <div class="picker"><label for="countrySel" id="countryL"></label>
      <div class="selwrap"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><select id="countrySel" class="big"></select></div>
    </div>
    <details class="holdsbox"><summary id="holdL"></summary>
      <div class="holds">
        <label><input type="checkbox" id="h_visa"><span id="h_visaL"></span></label>
        <label><input type="checkbox" id="h_wres"><span id="h_wresL"></span></label>
        <label><input type="checkbox" id="h_gcc"><span id="h_gccL"></span></label>
      </div>
    </details>
    <div id="guide" class="view"></div>
  </div>

  <div id="v-trips" class="view" hidden>
    <section class="form" id="stayCard"><h2 class="sth" id="st_t"></h2><p class="meta" id="st_i"></p>
      <div class="prow">
        <div class="field"><label for="st_c" id="st_cL"></label><select id="st_c"></select></div>
        <div class="field"><label for="st_s" id="st_sL"></label><input type="date" id="st_s"></div>
        <div class="field"><label for="st_x" id="st_xL"></label><input type="date" id="st_x"></div>
      </div>
      <div id="stayOut"></div>
    </section>
    <form class="form" id="tripForm">
      <div class="prow">
        <div class="field"><label for="tr_c" id="tr_cL"></label><select id="tr_c"></select></div>
        <div class="field"><label class="chk"><input type="checkbox" id="tr_drive"><span id="tr_driveL"></span></label></div>
        <div class="field"><label for="tr_s" id="tr_sL"></label><input type="date" id="tr_s" required></div>
        <div class="field"><label for="tr_e" id="tr_eL"></label><input type="date" id="tr_e" required></div>
      </div>
      <button type="submit" class="primary" id="tr_add"></button>
    </form>
    <div id="tripList" class="list"></div>
  </div>

  <div id="v-dates" class="view" hidden>
    <form class="form" id="dateForm">
      <div class="prow">
        <div class="field"><label for="d_t" id="d_tL"></label><select id="d_t"></select></div>
        <div class="field"><label for="d_n" id="d_nL"></label><input type="text" id="d_n" maxlength="40"></div>
        <div class="field"><label for="d_d" id="d_dL"></label><input type="date" id="d_d" required></div>
      </div>
      <button type="submit" class="primary" id="d_add"></button>
    </form>
    <div id="dateList" class="list"></div>
    <section class="form" id="bkCard"><h2 class="sth" id="bk_t"></h2><p class="meta" id="bk_i" style="margin:-6px 0 0"></p>
      <div class="row-btns"><button type="button" class="primary" id="bk_ex" style="flex:1"></button>
      <label class="ghost bkim" for="bk_file"><span id="bk_im"></span></label><input type="file" id="bk_file" accept=".json,application/json" hidden></div>
      <div class="meta" id="bk_msg" role="status"></div>
    </section>
  </div>

  <p class="disclaimer" id="disclaimer"></p>
  <p class="disclaimer privacy" id="privacy"></p>
</main>

<nav class="tabs" role="tablist"><div class="in">
  <button type="button" role="tab" data-v="countries" id="t_countries"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span></span></button>
  <button type="button" role="tab" data-v="trips" id="t_trips"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg><span></span></button>
  <button type="button" role="tab" data-v="dates" id="t_dates"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span></span></button>
</div></nav>
<script>
const q=(ar,en,fr,de)=>({ar,en,fr,de});
const LANGS=["ar","en","fr","de"];

/* ---------- Shared Schengen text ---------- */

{id:"tr",code:"TR",n:q("تركيا","Türkiye","Turquie","Türkei"),cur:"TRY ₺",side:"right",
 entry:q(["حسب جنسيتك: دخول بدون فيزا، أو فيزا إلكترونية، أو فيزا من السفارة.","الفيزا الإلكترونية تُطلب فقط من evisa.gov.tr، والرسوم تختلف حسب الجنسية."],["Depending on nationality: visa-free, e-Visa, or embassy visa.","Apply for the e-Visa only at evisa.gov.tr; fees vary by nationality."],["Selon la nationalité : sans visa, e-Visa ou visa d'ambassade.","Demandez l'e-Visa uniquement sur evisa.gov.tr ; les frais varient selon la nationalité."],["Je nach Staatsangehörigkeit: visumfrei, E-Visum oder Botschaftsvisum.","Das E-Visum nur über evisa.gov.tr beantragen; Gebühren je nach Nationalität."]),

{id:"ae",code:"AE",n:q("الإمارات","UAE","Émirats arabes unis","VAE"),cur:"AED",side:"right",
 entry:q(["مواطنو الخليج يدخلون بالهوية. جنسيات كثيرة تدخل بدون فيزا أو بفيزا عند الوصول، والباقي يحتاج فيزا مسبقة.","تأكد من شروط جنسيتك على البوابة الرسمية."],["GCC citizens enter with their ID card. Many nationalities enter visa-free or on arrival; others need one in advance.","Check your nationality's rules on the official portal."],["Les citoyens du Golfe entrent avec leur carte d'identité. Beaucoup de nationalités entrent sans visa ou avec un visa à l'arrivée ; les autres doivent l'obtenir avant.","Vérifiez les règles de votre nationalité sur le portail officiel."],["GCC-Bürger reisen mit Personalausweis ein. Viele Nationalitäten reisen visumfrei oder mit Visum bei Ankunft ein; andere brauchen es vorab.","Prüfen Sie die Regeln für Ihre Nationalität auf dem offiziellen Portal."]),

 res:q(["الإقامة مرتبطة بالعمل أو الكفيل أو الاستثمار، وتصدر معها الهوية الإماراتية.","تجاوز مدة الفيزا أو الإقامة عليه غرامات عن كل يوم."],["Residence is tied to a job, sponsor or investment, with an Emirates ID.","Overstaying a visa or residence brings daily fines."],["La résidence dépend d'un emploi, d'un garant ou d'un investissement, avec une carte Emirates ID.","Dépasser son visa ou sa résidence entraîne des amendes journalières."],["Aufenthalt ist an Job, Sponsor oder Investition gebunden, mit Emirates ID.","Überziehen von Visum oder Aufenthalt kostet tägliche Strafgebühren."]),

 drive:q(["السرعات تختلف حسب الطريق، وتُطبق بالكاميرات بدقة.","استخدام الهاتف أثناء القيادة عليه غرامة كبيرة."],["Limits vary by road and are strictly camera-enforced.","Using a phone while driving carries a heavy fine."],["Les limites varient selon la route et sont strictement contrôlées par caméras.","Téléphoner au volant coûte une forte amende."],["Tempolimits variieren je nach Straße und werden streng per Kamera kontrolliert.","Handy am Steuer kostet ein hohes Bußgeld."]),
 laws:q(["الألفاظ والإشارات المسيئة، حتى في الرسائل ووسائل التواصل، قد تؤدي إلى غرامة أو سجن.","تصوير الأشخاص دون إذنهم ونشر صورهم ممنوع."],["Abusive words or gestures, including in messages and social media, can lead to fines or jail.","Photographing people without consent and posting their images is illegal."],["Insultes ou gestes grossiers, y compris par message ou sur les réseaux, peuvent valoir amende ou prison.","Photographier des personnes sans leur accord et publier leur image est illégal."],["Beleidigungen oder obszöne Gesten, auch in Nachrichten und sozialen Medien, können Geld- oder Haftstrafen bringen.","Menschen ohne Zustimmung zu fotografieren und Bilder zu posten ist verboten."]),
 warn:q(["بعض الأدوية الشائعة (مثل التي تحتوي على الكودايين) تحتاج تصريحاً مسبقاً. احمل الوصفة الطبية.","المخدرات بكل أنواعها عقوبتها شديدة، حتى الكميات الصغيرة."],["Some common medicines (e.g. with codeine) need prior approval; carry your prescription.","Penalties for any drugs are severe, even for tiny amounts."],["Certains médicaments courants (avec codéine, par ex.) exigent une autorisation préalable ; ayez votre ordonnance.","Les peines pour toute drogue sont sévères, même pour de très petites quantités."],["Manche gängige Medikamente (z. B. mit Codein) brauchen eine Vorabgenehmigung; Rezept mitführen.","Drogendelikte werden hart bestraft, auch bei kleinsten Mengen."]),

{id:"ge",code:"GE",n:q("جورجيا","Georgia","Géorgie","Georgien"),cur:"GEL",side:"right",
 entry:q(["مواطنو الخليج وبريطانيا وأمريكا والاتحاد الأوروبي يدخلون بدون فيزا حتى سنة.","بعض الجنسيات تدخل بدون فيزا إذا كانت تحمل فيزا أمريكية أو بريطانية أو شنغن أو إقامة خليجية سارية، والباقي يطلب فيزا إلكترونية.","منذ 1 يناير 2026 التأمين الصحي للسفر إلزامي لكل الزوار، بتغطية 30,000 لاري على الأقل."],["GCC, UK, US and EU citizens enter visa-free for up to a year.","Some nationalities enter visa-free with a valid US, UK or Schengen visa or GCC residence; others apply for an e-Visa.","Since 1 Jan 2026, travel health insurance is mandatory for all visitors, with at least 30,000 GEL cover."],["Les citoyens du Golfe, du Royaume-Uni, des États-Unis et de l'UE entrent sans visa jusqu'à un an.","Certaines nationalités entrent sans visa avec un visa américain, britannique ou Schengen valide, ou une résidence au Golfe ; les autres demandent un e-Visa.","Depuis le 1er janvier 2026, une assurance santé voyage d'au moins 30 000 GEL est obligatoire pour tous."],["Bürger der Golfstaaten, des UK, der USA und der EU reisen bis zu einem Jahr visumfrei ein.","Manche Nationalitäten reisen mit gültigem US-, UK- oder Schengen-Visum oder GCC-Aufenthalt visumfrei ein; andere beantragen ein E-Visum.","Seit 1. Januar 2026 ist eine Reisekrankenversicherung mit mindestens 30.000 GEL Pflicht für alle."]),

{id:"us",code:"US",n:q("الولايات المتحدة","United States","États-Unis","USA"),cur:"USD $",side:"right",
 entry:q(["مواطنو بريطانيا ومعظم دول الاتحاد الأوروبي يحتاجون تصريح ESTA: 40.27 دولاراً، صالح سنتين.","الجنسيات الأخرى تحتاج فيزا زيارة (B1/B2) بمقابلة في السفارة، ورسومها 185 دولاراً. رسم \"نزاهة الفيزا\" (250 دولاراً) صدر به قانون لكنه لا يُحصَّل حتى الآن.","منذ 1 يناير 2026 يُمنع دخول حاملي جوازات 19 دولة، منها سوريا وليبيا واليمن والسودان، وكذلك وثائق السلطة الفلسطينية. و20 دولة أخرى موقوفة لها فيزا الزيارة والدراسة."],["UK and most EU citizens need an ESTA: $40.27, valid 2 years.","Other nationalities need a B1/B2 visitor visa with an embassy interview; the fee is $185. A $250 \"visa integrity fee\" is in law but is not being collected yet.","Since 1 Jan 2026 entry is suspended for passports of 19 countries, including Syria, Libya, Yemen and Sudan, and for Palestinian Authority documents. 20 more countries have visitor and student visas suspended."],["Les citoyens britanniques et la plupart des Européens ont besoin d'un ESTA : 40,27 $, valable 2 ans.","Les autres nationalités ont besoin d'un visa visiteur B1/B2 avec entretien à l'ambassade ; les frais sont de 185 $. Des frais d'« intégrité » de 250 $ sont prévus par la loi mais ne sont pas encore perçus.","Depuis le 1er janvier 2026, l'entrée est suspendue pour les passeports de 19 pays, dont la Syrie, la Libye, le Yémen et le Soudan, ainsi que pour les documents de l'Autorité palestinienne. 20 autres pays n'ont plus accès aux visas visiteur et étudiant."],["Briten und die meisten EU-Bürger brauchen ein ESTA: 40,27 $, 2 Jahre gültig.","Andere Nationalitäten brauchen ein B1/B2-Besuchervisum mit Interview; die Gebühr beträgt 185 $. Eine gesetzlich vorgesehene „Visa Integrity Fee“ von 250 $ wird noch nicht erhoben.","Seit 1. Januar 2026 ist die Einreise für Pässe aus 19 Ländern ausgesetzt, darunter Syrien, Libyen, Jemen und Sudan, sowie für Dokumente der Palästinensischen Autonomiebehörde. Für 20 weitere Länder sind Besucher- und Studentenvisa ausgesetzt."]),
 entrySrc:{u:"https://esta.cbp.dhs.gov",t:"esta.cbp.dhs.gov"},
 res:q(["ESTA وفيزا الزيارة لا تسمحان بالعمل أو الدراسة.","قرار إيقاف فيزا الهجرة لمواطني 75 دولة أُلغي بحكم محكمة في أغسطس 2026، لكن المواعيد تعود ببطء. حظر السفر على 39 دولة ما زال سارياً."],["ESTA and visitor visas do not allow work or study.","The 75-country immigrant visa pause was struck down by a court in August 2026, but interviews are resuming slowly. The 39-country travel ban still applies."],["L'ESTA et le visa visiteur ne permettent ni de travailler ni d'étudier.","La suspension des visas d'immigrant pour 75 pays a été annulée par un tribunal en août 2026, mais les entretiens reprennent lentement. L'interdiction visant 39 pays reste en vigueur."],["ESTA und Besuchervisum erlauben weder Arbeit noch Studium.","Der Stopp für Einwanderungsvisa für 75 Länder wurde im August 2026 gerichtlich aufgehoben, Termine laufen aber nur langsam wieder an. Das Einreiseverbot für 39 Länder gilt weiter."]),
 resSrc:{u:"https://travel.state.gov",t:"travel.state.gov"},

{id:"kw",code:"KW",n:q("الكويت","Kuwait","Koweït","Kuwait"),cur:"KWD",side:"right",
 entry:q(["مواطنو الخليج يدخلون بالهوية الوطنية.","منصة Kuwait Visa (منذ أغسطس 2025): مواطنو بريطانيا والاتحاد الأوروبي وأمريكا وعشرات الدول الأخرى يحصلون على فيزا سياحية إلكترونية أو عند الوصول.","مقيمو الخليج يمكنهم طلب فيزا سياحية بشرط إقامة سارية، والجنسيات الأخرى تحتاج شروطاً إضافية."],
  ["GCC citizens enter with their national ID.","Kuwait Visa platform (since Aug 2025): UK, EU, US and dozens of other nationalities get a tourist e-Visa or visa on arrival.","GCC residents can get a tourist visa with valid residence; other nationalities face extra conditions."],
  ["Les citoyens du Golfe entrent avec leur carte d'identité.","Plateforme Kuwait Visa (depuis août 2025) : Britanniques, Européens, Américains et des dizaines d'autres nationalités obtiennent un e-Visa touristique ou un visa à l'arrivée.","Les résidents du Golfe peuvent obtenir un visa touristique avec une résidence valide ; les autres nationalités ont des conditions supplémentaires."],
  ["GCC-Bürger reisen mit Personalausweis ein.","Plattform Kuwait Visa (seit Aug. 2025): Briten, EU- und US-Bürger sowie Dutzende weitere Nationalitäten erhalten ein Touristen-E-Visum oder Visum bei Ankunft.","GCC-Einwohner erhalten mit gültigem Aufenthalt ein Touristenvisum; für andere Nationalitäten gelten zusätzliche Bedingungen."]),
 entrySrc:{u:"https://evisa.moi.gov.kw",t:"evisa.moi.gov.kw"},
 res:q(["الإقامة والعمل عن طريق صاحب العمل (الكفيل) والهيئة العامة للقوى العاملة.","الفيزا السياحية لا تسمح بالعمل، وتجاوز المدة عليه غرامة يومية وقد يؤدي إلى الترحيل."],
  ["Residence and work go through an employer (sponsor) and the Public Authority for Manpower.","A tourist visa does not allow work; overstaying brings daily fines and can lead to deportation."],
  ["Résidence et travail passent par un employeur (garant) et l'Autorité publique de la main-d'œuvre.","Le visa touristique ne permet pas de travailler ; le dépassement entraîne des amendes journalières et peut mener à l'expulsion."],
  ["Aufenthalt und Arbeit laufen über einen Arbeitgeber (Sponsor) und die Behörde für Arbeitskräfte.","Ein Touristenvisum erlaubt keine Arbeit; Überziehen kostet tägliche Strafen und kann zur Abschiebung führen."]),
 resSrc:{u:"https://www.moi.gov.kw",t:"moi.gov.kw"},money:BIGCASH,
 drive:q(["السرعات تُطبق بالكاميرات بدقة، وغرامات المرور ارتفعت كثيراً منذ 2025.","استخدام الهاتف أثناء القيادة مخالفة كبيرة."],["Limits are strictly camera-enforced, and traffic fines rose sharply in 2025.","Using a phone while driving is a serious offence."],["Les vitesses sont contrôlées par caméras et les amendes ont fortement augmenté en 2025.","Téléphoner au volant est une infraction grave."],["Tempolimits werden streng per Kamera überwacht; Bußgelder sind 2025 stark gestiegen.","Handy am Steuer ist ein schwerer Verstoß."]),
 laws:q(["الكحول ممنوع تماماً.","اللباس المحتشم في الأماكن العامة."],["Alcohol is completely banned.","Dress modestly in public."],["L'alcool est totalement interdit.","Tenue modeste en public."],["Alkohol ist vollständig verboten.","In der Öffentlichkeit dezent kleiden."]),
 warn:q(["المخدرات عقوبتها شديدة جداً، واحمل وصفة طبية لأي دواء.","حرارة الصيف قد تتجاوز 50 درجة، فتجنب الخروج وقت الظهيرة."],["Drug penalties are very severe; carry prescriptions for any medicine.","Summer heat can exceed 50°C; avoid going out at midday."],["Les peines liées à la drogue sont très sévères ; ayez l'ordonnance de vos médicaments.","En été, la chaleur peut dépasser 50 °C ; évitez de sortir à midi."],["Drogendelikte werden sehr hart bestraft; Rezepte für Medikamente mitführen.","Im Sommer sind über 50 °C möglich; mittags nicht draußen sein."]),
 sos:[[q("طوارئ","Emergency","Urgences","Notruf"),"112"]]},

{id:"bh",code:"BH",n:q("البحرين","Bahrain","Bahreïn","Bahrain"),cur:"BHD",side:"right",
 entry:q(["مواطنو الخليج يدخلون بالهوية الوطنية.","مواطنو بريطانيا وأمريكا والاتحاد الأوروبي يحصلون على فيزا عند الوصول أو إلكترونية (أسبوعان أو شهر حسب النوع).","الفيزا الإلكترونية متاحة لأكثر من 200 جنسية، ولمقيمي الخليج فيزا خاصة (3 أو 7 أيام) والدخول عبر المطار."],
  ["GCC citizens enter with their national ID.","UK, US and EU citizens get a visa on arrival or e-Visa (2 weeks or 1 month depending on type).","The e-Visa is open to over 200 nationalities; GCC residents have a special 3- or 7-day e-Visa, entering via the airport."],
  ["Les citoyens du Golfe entrent avec leur carte d'identité.","Britanniques, Américains et Européens obtiennent un visa à l'arrivée ou un e-Visa (2 semaines ou 1 mois selon le type).","L'e-Visa est ouvert à plus de 200 nationalités ; les résidents du Golfe ont un e-Visa spécial de 3 ou 7 jours, avec entrée par l'aéroport."],
  ["GCC-Bürger reisen mit Personalausweis ein.","Briten, US- und EU-Bürger erhalten ein Visum bei Ankunft oder E-Visum (2 Wochen oder 1 Monat je nach Art).","Das E-Visum steht über 200 Nationalitäten offen; GCC-Einwohner haben ein eigenes 3- oder 7-Tage-E-Visum mit Einreise über den Flughafen."]),
 entrySrc:{u:"https://www.evisa.gov.bh",t:"evisa.gov.bh"},
 res:q(["الإقامة وتصاريح العمل عبر هيئة تنظيم سوق العمل (LMRA) وصاحب العمل.","الفيزا السياحية لا تسمح بالعمل."],["Residence and work permits go through the LMRA and your employer.","A tourist visa does not allow work."],["Résidence et permis de travail via la LMRA et l'employeur.","Le visa touristique ne permet pas de travailler."],["Aufenthalt und Arbeitserlaubnis über die LMRA und den Arbeitgeber.","Ein Touristenvisum erlaubt keine Arbeit."]),

 drive:q(["جسر الملك فهد يربطك بالسعودية؛ جهّز أوراق السيارة وتوقّع ازدحاماً في العطل.","السرعات تُطبق بالكاميرات."],["The King Fahd Causeway links you to Saudi Arabia; bring car papers and expect queues on holidays.","Limits are camera-enforced."],["La chaussée du Roi Fahd relie à l'Arabie saoudite ; ayez les papiers du véhicule et prévoyez des files les jours fériés.","Les vitesses sont contrôlées par caméras."],["Der King-Fahd-Damm verbindet mit Saudi-Arabien; Fahrzeugpapiere mitnehmen, an Feiertagen Staus einplanen.","Tempolimits werden per Kamera überwacht."]),

{id:"lb",code:"LB",n:q("لبنان","Lebanon","Liban","Libanon"),cur:"LBP / USD",side:"right",
 entry:q(["مواطنو الخليج والأردن يحصلون على فيزا مجانية عند الوصول.","مواطنو بريطانيا وأمريكا ومعظم دول الاتحاد الأوروبي يحصلون على فيزا عند الوصول لمدة شهر.","جنسيات أخرى (منها مصر والعراق ودول المغرب العربي) تحتاج شروطاً أو فيزا مسبقة، وللسوريين قواعد خاصة."],
  ["GCC and Jordanian citizens get a free visa on arrival.","UK, US and most EU citizens get a one-month visa on arrival.","Other nationalities (including Egypt, Iraq and the Maghreb) need conditions or a visa in advance; Syrians have special rules."],
  ["Les citoyens du Golfe et les Jordaniens obtiennent un visa gratuit à l'arrivée.","Britanniques, Américains et la plupart des Européens obtiennent un visa d'un mois à l'arrivée.","D'autres nationalités (dont Égypte, Irak et Maghreb) doivent remplir des conditions ou obtenir un visa préalable ; les Syriens ont des règles spéciales."],
  ["Bürger der Golfstaaten und Jordaniens erhalten ein kostenloses Visum bei Ankunft.","Briten, US- und die meisten EU-Bürger erhalten ein einmonatiges Visum bei Ankunft.","Andere Nationalitäten (u. a. Ägypten, Irak, Maghreb) brauchen Bedingungen oder ein Visum vorab; für Syrer gelten Sonderregeln."]),
 entrySrc:{u:"https://www.general-security.gov.lb",t:"general-security.gov.lb"},
 res:q(["الإقامة والعمل عبر الأمن العام اللبناني ووزارة العمل.","تجاوز مدة الإقامة عليه غرامة وقد يمنعك من العودة."],["Residence and work go through General Security and the Labour Ministry.","Overstaying brings fines and can bar your return."],["Résidence et travail via la Sûreté générale et le ministère du Travail.","Le dépassement de séjour entraîne une amende et peut empêcher le retour."],["Aufenthalt und Arbeit über die Sûreté générale und das Arbeitsministerium.","Überziehen kostet Strafe und kann eine Wiedereinreise verhindern."]),
 resSrc:{u:"https://www.general-security.gov.lb",t:"general-security.gov.lb"},
 money:q(["الدولار الأمريكي مستخدم على نطاق واسع، وكثير من المحلات تفضّل النقد.","الأزمة المصرفية مستمرة منذ 2019، فاحمل نقداً كافياً مع بطاقة احتياطية."],["US dollars are widely used and many shops prefer cash.","The banking crisis since 2019 continues; carry enough cash plus a backup card."],["Le dollar américain est très utilisé et beaucoup de commerces préfèrent les espèces.","La crise bancaire depuis 2019 se poursuit ; ayez assez d'espèces et une carte de secours."],["US-Dollar sind weit verbreitet, viele Geschäfte bevorzugen Bargeld.","Die Bankenkrise seit 2019 dauert an; genug Bargeld und eine Ersatzkarte mitnehmen."]),
 drive:q(["القيادة مزدحمة وغير منتظمة، وقد تتوقف إشارات المرور عند انقطاع الكهرباء.","نقاط التفتيش منتشرة، فاحمل جوازك دائماً."],["Traffic is heavy and chaotic; traffic lights may stop during power cuts.","Checkpoints are common; always carry your passport."],["La circulation est dense et chaotique ; les feux peuvent s'arrêter lors des coupures de courant.","Les contrôles sont fréquents ; ayez toujours votre passeport."],["Der Verkehr ist dicht und chaotisch; Ampeln fallen bei Stromausfällen aus.","Kontrollpunkte sind häufig; Pass immer mitführen."]),
 laws:q(["تصوير المواقع العسكرية ممنوع.","وجود أختام أو بضائع إسرائيلية في جوازك أو أمتعتك قد يمنعك من الدخول."],["Photographing military sites is forbidden.","Israeli stamps or goods in your passport or luggage can get you refused entry."],["Photographier les sites militaires est interdit.","Des tampons ou produits israéliens dans votre passeport ou vos bagages peuvent entraîner un refus d'entrée."],["Militärische Anlagen dürfen nicht fotografiert werden.","Israelische Stempel oder Waren im Pass oder Gepäck können zur Einreiseverweigerung führen."]),
 warn:q(["راجع تحذيرات السفر الرسمية قبل الذهاب، فالوضع الأمني في الجنوب والبقاع قد يتغير بسرعة."],["Check official travel advice before going; security in the south and the Bekaa can change quickly."],["Consultez les conseils aux voyageurs officiels avant de partir ; la sécurité au sud et dans la Bekaa peut changer vite."],["Vor der Reise offizielle Reisehinweise prüfen; die Sicherheitslage im Süden und in der Bekaa kann sich schnell ändern."]),

{id:"tn",code:"TN",n:q("تونس","Tunisia","Tunisie","Tunesien"),cur:"TND",side:"right",
 entry:q(["مواطنو بريطانيا وأمريكا ومعظم دول الاتحاد الأوروبي والمغرب والجزائر يدخلون بدون فيزا (غالباً حتى 90 يوماً).","لا توجد فيزا إلكترونية؛ الجنسيات الأخرى تطلب الفيزا من السفارة، وبعضها يدخل ضمن رحلة منظمة بقسيمة فندق.","العراقيون: بدون فيزا حتى 15 يوماً للسياحة فقط."],
  ["UK, US, most EU, Moroccan and Algerian citizens enter visa-free (usually up to 90 days).","There is no e-Visa; other nationalities apply at the embassy, and some can enter on an organised tour with a hotel voucher.","Iraqis: visa-free up to 15 days, for tourism only."],
  ["Britanniques, Américains, la plupart des Européens, Marocains et Algériens entrent sans visa (généralement jusqu'à 90 jours).","Pas d'e-Visa ; les autres nationalités passent par l'ambassade, et certaines entrent en voyage organisé avec bon d'hôtel.","Irakiens : sans visa jusqu'à 15 jours, pour le tourisme uniquement."],
  ["Briten, US-Bürger, die meisten EU-Bürger, Marokkaner und Algerier reisen visumfrei ein (meist bis 90 Tage).","Es gibt kein E-Visum; andere Nationalitäten beantragen das Visum bei der Botschaft, manche reisen mit organisierter Tour und Hotelgutschein ein.","Iraker: bis zu 15 Tage visumfrei, nur für Tourismus."]),
 entrySrc:{u:"https://www.diplomatie.gov.tn",t:"diplomatie.gov.tn"},
 res:q(["للبقاء أكثر من 90 يوماً تطلب بطاقة إقامة من مركز الشرطة أو الحرس الوطني."],["To stay over 90 days, apply for a residence card at the police or National Guard station."],["Au-delà de 90 jours, demandez une carte de séjour au commissariat ou à la Garde nationale."],["Für über 90 Tage eine Aufenthaltskarte bei Polizei oder Nationalgarde beantragen."]),
 resSrc:{u:"https://www.diplomatie.gov.tn",t:"diplomatie.gov.tn"},
 money:q(["الدينار عملة مغلقة: لا يجوز إدخاله أو إخراجه، فاصرف داخل البلد واحتفظ بالإيصالات لإعادة التحويل."],["The dinar is a closed currency: it can't be taken in or out, so exchange locally and keep receipts to change back."],["Le dinar est une monnaie non convertible : ni import ni export ; changez sur place et gardez les reçus pour reconvertir."],["Der Dinar ist eine geschlossene Währung: keine Ein- oder Ausfuhr; vor Ort tauschen und Belege für den Rücktausch aufbewahren."]),
 drive:q(["50 كم/س في المدن، 90 خارجها، 110 على الطرق السريعة.","حواجز الشرطة كثيرة، فاحمل أوراقك وأوراق السيارة."],["50 km/h in towns, 90 outside, 110 on motorways.","Police checkpoints are frequent; carry your papers and the car's."],["50 km/h en ville, 90 hors agglomération, 110 sur autoroute.","Les contrôles de police sont fréquents ; ayez vos papiers et ceux du véhicule."],["50 km/h innerorts, 90 außerorts, 110 auf Autobahnen.","Polizeikontrollen sind häufig; eigene Papiere und Fahrzeugpapiere mitführen."]),

{id:"az",code:"AZ",n:q("أذربيجان","Azerbaijan","Azerbaïdjan","Aserbaidschan"),cur:"AZN",side:"right",
 entry:q(["مواطنو تركيا والإمارات وقطر والمغرب يدخلون بدون فيزا.","معظم الجنسيات الأخرى، ومنها بريطانيا وأمريكا والاتحاد الأوروبي، تطلب فيزا ASAN الإلكترونية: 25 دولاراً، دخول واحد حتى 30 يوماً.","حاملو إقامة خليجية يحصلون على فيزا عند الوصول لمدة 30 يوماً."],
  ["Turkish, UAE, Qatari and Moroccan citizens enter visa-free.","Most other nationalities, including UK, US and EU, apply for the ASAN e-Visa: $25, single entry up to 30 days.","Holders of a GCC residence get a 30-day visa on arrival."],
  ["Les citoyens turcs, émiratis, qataris et marocains entrent sans visa.","La plupart des autres nationalités, dont Royaume-Uni, États-Unis et UE, demandent l'e-Visa ASAN : 25 $, entrée simple jusqu'à 30 jours.","Les titulaires d'une résidence au Golfe obtiennent un visa de 30 jours à l'arrivée."],
  ["Bürger der Türkei, der VAE, Katars und Marokkos reisen visumfrei ein.","Die meisten anderen, auch Briten, US- und EU-Bürger, beantragen das ASAN-E-Visum: 25 $, einfache Einreise bis 30 Tage.","Inhaber eines GCC-Aufenthaltstitels erhalten ein 30-Tage-Visum bei Ankunft."]),
 entrySrc:{u:"https://evisa.gov.az",t:"evisa.gov.az"},
 res:q(["إذا بقيت أكثر من 15 يوماً يجب تسجيل عنوانك لدى دائرة الهجرة (الفندق يقوم بذلك عادة)."],["If you stay over 15 days you must register your address with the Migration Service (hotels usually do this)."],["Au-delà de 15 jours, vous devez déclarer votre adresse au Service des migrations (l'hôtel s'en charge généralement)."],["Bei über 15 Tagen Aufenthalt Adresse beim Migrationsdienst registrieren (Hotels erledigen das meist)."]),

 drive:q(["السرعات تُطبق بالكاميرات، والغرامات تُسجل على السيارة حتى المستأجرة.","المعابر البرية مقيدة منذ 2020؛ ادخل جواً ما لم تتأكد من فتح المعبر."],["Limits are camera-enforced and fines are logged against the car, rentals included.","Land borders have been restricted since 2020; arrive by air unless you've confirmed a crossing is open."],["Les vitesses sont contrôlées par caméras et les amendes sont liées au véhicule, location comprise.","Les frontières terrestres sont restreintes depuis 2020 ; arrivez par avion sauf confirmation qu'un poste est ouvert."],["Tempolimits werden per Kamera überwacht; Bußgelder werden dem Fahrzeug zugeordnet, auch Mietwagen.","Landgrenzen sind seit 2020 eingeschränkt; per Flug einreisen, sofern ein Übergang nicht bestätigt offen ist."]),

{id:"th",code:"TH",n:q("تايلاند","Thailand","Thaïlande","Thailand"),cur:"THB ฿",side:"left",
 entry:q(["منذ 15 سبتمبر 2026 صار الإعفاء من الفيزا 30 يوماً بدل 60، ويشمل دول الخليج والأردن وبريطانيا وأمريكا والاتحاد الأوروبي، ويمكن طلب تمديد 30 يوماً.","بطاقة الوصول الرقمية TDAC إلزامية لكل الزوار، وتُعبأ خلال 3 أيام قبل الوصول.","جنسيات أخرى (منها المغرب) تحتاج فيزا إلكترونية مسبقة."],
  ["Since 15 Sep 2026 visa-free stays are 30 days instead of 60, covering the GCC, Jordan, UK, US and EU; a 30-day extension can be requested.","The TDAC digital arrival card is mandatory for all visitors, within 3 days before arrival.","Other nationalities (including Morocco) need an e-Visa in advance."],
  ["Depuis le 15 sept. 2026, l'exemption est de 30 jours au lieu de 60 (Golfe, Jordanie, Royaume-Uni, États-Unis, UE), prolongeable de 30 jours sur demande.","La carte d'arrivée numérique TDAC est obligatoire pour tous, dans les 3 jours avant l'arrivée.","D'autres nationalités (dont le Maroc) ont besoin d'un e-Visa préalable."],
  ["Seit 15. Sept. 2026 gilt die Visumfreiheit 30 statt 60 Tage (Golfstaaten, Jordanien, UK, USA, EU); eine Verlängerung um 30 Tage ist möglich.","Die digitale Ankunftskarte TDAC ist für alle Pflicht, innerhalb von 3 Tagen vor Ankunft.","Andere Nationalitäten (u. a. Marokko) brauchen vorab ein E-Visum."]),
 entrySrc:{u:"https://tdac.immigration.go.th",t:"tdac.immigration.go.th"},
 res:q(["الإعفاء للسياحة فقط؛ العمل يحتاج فيزا وتصريح عمل.","للإقامة الطويلة توجد فيزا DTV وبرنامج Thailand Privilege بشروط مالية."],["Visa-free entry is for tourism only; work needs a visa and work permit.","Long stays: the DTV visa or Thailand Privilege, with financial requirements."],["L'exemption vaut pour le tourisme uniquement ; travailler exige un visa et un permis de travail.","Long séjour : visa DTV ou Thailand Privilege, avec conditions financières."],["Visumfreiheit gilt nur für Tourismus; Arbeit braucht Visum und Arbeitserlaubnis.","Langzeit: DTV-Visum oder Thailand Privilege, mit finanziellen Voraussetzungen."]),
 resSrc:{u:"https://www.thaievisa.go.th",t:"thaievisa.go.th"},
 money:q(["صرّح عن العملات الأجنبية التي تتجاوز ما يعادل 20,000 دولار عند الدخول أو الخروج."],["Declare foreign currency above the equivalent of US$20,000 on entry or exit."],["Déclarez les devises au-delà de l'équivalent de 20 000 $ US à l'entrée ou à la sortie."],["Devisen über umgerechnet 20.000 US-$ bei Ein- oder Ausreise anmelden."]),
 drive:q(["القيادة على اليسار.","الرخصة الدولية مطلوبة مع رخصتك، وقيادة دراجة نارية بدون رخصة دراجة قد تُبطل التأمين."],["Drive on the left.","An international permit is required with your licence; riding a scooter without a motorbike licence can void your insurance."],["Conduite à gauche.","Permis international obligatoire avec votre permis ; conduire un scooter sans permis moto peut annuler l'assurance."],["Linksverkehr.","Internationaler Führerschein ist Pflicht; Rollerfahren ohne Motorradführerschein kann den Versicherungsschutz kosten."]),
 laws:q(["إهانة الملك أو الأسرة المالكة جريمة عقوبتها سجن طويل، حتى على الإنترنت.","السجائر الإلكترونية ممنوعة، وعقوبتها غرامة كبيرة أو سجن."],["Insulting the King or royal family is a crime with long prison terms, including online.","E-cigarettes are banned, with heavy fines or jail."],["Insulter le roi ou la famille royale est un délit puni de longues peines de prison, y compris en ligne.","Les cigarettes électroniques sont interdites, sous peine de fortes amendes ou de prison."],["Beleidigung des Königs oder der Königsfamilie ist strafbar mit langen Haftstrafen, auch online.","E-Zigaretten sind verboten; es drohen hohe Geld- oder Haftstrafen."]),
 warn:q(["احذر حيل التوك توك والمجوهرات المزيفة في بانكوك."],["Beware tuk-tuk and fake gem scams in Bangkok."],["Méfiez-vous des arnaques aux tuk-tuks et aux fausses pierres précieuses à Bangkok."],["Vorsicht vor Tuk-Tuk- und Edelstein-Betrug in Bangkok."]),

{id:"id",code:"ID",n:q("إندونيسيا","Indonesia","Indonésie","Indonesien"),cur:"IDR",side:"left",
 entry:q(["مواطنو الخليج وبريطانيا وأمريكا والاتحاد الأوروبي يحصلون على فيزا إلكترونية أو عند الوصول (e-VOA): 500,000 روبية، 30 يوماً قابلة للتمديد مرة.","عبّئ بطاقة الوصول All Indonesia قبل الوصول.","بالي تفرض رسماً سياحياً 150,000 روبية على كل زائر أجنبي."],
  ["GCC, UK, US and EU citizens get an e-VOA or visa on arrival: IDR 500,000, 30 days, extendable once.","Fill in the All Indonesia arrival card before arrival.","Bali charges every foreign visitor a IDR 150,000 tourist levy."],
  ["Les citoyens du Golfe, du Royaume-Uni, des États-Unis et de l'UE obtiennent un e-VOA ou un visa à l'arrivée : 500 000 IDR, 30 jours, prolongeable une fois.","Remplissez la carte d'arrivée All Indonesia avant l'arrivée.","Bali impose une taxe touristique de 150 000 IDR à chaque visiteur étranger."],
  ["Bürger der Golfstaaten, des UK, der USA und der EU erhalten ein E-VOA oder Visum bei Ankunft: 500.000 IDR, 30 Tage, einmal verlängerbar.","Vor Ankunft die Ankunftskarte All Indonesia ausfüllen.","Bali erhebt von jedem ausländischen Besucher eine Touristenabgabe von 150.000 IDR."]),
 entrySrc:{u:"https://evisa.imigrasi.go.id",t:"evisa.imigrasi.go.id"},
 res:q(["الإقامة والعمل عبر تصاريح KITAS بكفالة صاحب العمل أو برامج خاصة."],["Residence and work need a KITAS permit, sponsored by an employer or a special programme."],["Résidence et travail exigent un permis KITAS, parrainé par un employeur ou un programme spécial."],["Aufenthalt und Arbeit brauchen eine KITAS-Genehmigung über Arbeitgeber oder Sonderprogramm."]),
 resSrc:{u:"https://evisa.imigrasi.go.id",t:"evisa.imigrasi.go.id"},
 money:q(["صرّح عن النقد الذي يعادل 100 مليون روبية أو أكثر."],["Declare cash worth IDR 100 million or more."],["Déclarez les espèces de 100 millions IDR ou plus."],["Bargeld ab 100 Mio. IDR anmelden."]),
 drive:q(["القيادة على اليسار.","حركة الدراجات النارية كثيفة جداً؛ استأجر سائقاً إذا لم تكن معتاداً عليها."],["Drive on the left.","Scooter traffic is very dense; hire a driver if you're not used to it."],["Conduite à gauche.","La circulation des scooters est très dense ; prenez un chauffeur si vous n'êtes pas habitué."],["Linksverkehr.","Sehr dichter Rollerverkehr; ohne Erfahrung lieber einen Fahrer nehmen."]),
 laws:q(["عقوبات المخدرات شديدة جداً وقد تصل إلى الإعدام.","قانون العقوبات الجديد (منذ يناير 2026) يجرّم العلاقات خارج الزواج، ويُطبق على الزوار أيضاً عند شكوى أحد الأقارب."],["Drug penalties are extremely severe and can include the death penalty.","The new criminal code (since Jan 2026) criminalises sex outside marriage, also for visitors, if a relative files a complaint."],["Les peines liées à la drogue sont extrêmement sévères, peine de mort comprise.","Le nouveau code pénal (depuis janvier 2026) punit les relations hors mariage, y compris pour les visiteurs, sur plainte d'un proche."],["Drogendelikte werden extrem hart bestraft, bis zur Todesstrafe.","Das neue Strafgesetzbuch (seit Jan. 2026) bestraft außerehelichen Sex, auch bei Besuchern, wenn ein Angehöriger Anzeige erstattet."]),
 warn:q(["احترم المعابد والطقوس في بالي، ولا تتسلق الأماكن المقدسة."],["Respect temples and ceremonies in Bali, and never climb sacred sites."],["Respectez les temples et cérémonies à Bali, et ne grimpez jamais sur les sites sacrés."],["Tempel und Zeremonien auf Bali respektieren; heilige Stätten nie besteigen."]),

{id:"ca",code:"CA",n:q("كندا","Canada","Canada","Kanada"),cur:"CAD $",side:"right",
 entry:q(["مواطنو بريطانيا والاتحاد الأوروبي والإمارات يحتاجون تصريح eTA عند السفر جواً: 7 دولارات كندية، صالح حتى 5 سنوات.","مواطنو أمريكا يدخلون بجوازهم فقط.","معظم الجنسيات العربية الأخرى تحتاج فيزا زيارة (TRV) مع بصمات."],
  ["UK, EU and UAE citizens need an eTA to fly in: CAD 7, valid up to 5 years.","US citizens enter with their passport only.","Most other Arab nationalities need a visitor visa (TRV) with biometrics."],
  ["Les citoyens britanniques, européens et émiratis ont besoin d'une AVE (eTA) pour arriver en avion : 7 $ CA, valable jusqu'à 5 ans.","Les Américains entrent avec leur seul passeport.","La plupart des autres nationalités arabes ont besoin d'un visa de visiteur (TRV) avec données biométriques."],
  ["Briten, EU- und VAE-Bürger brauchen für die Anreise per Flug eine eTA: 7 CAD, bis zu 5 Jahre gültig.","US-Bürger reisen nur mit ihrem Pass ein.","Die meisten anderen arabischen Nationalitäten brauchen ein Besuchervisum (TRV) mit Biometrie."]),
 entrySrc:{u:"https://www.canada.ca/en/immigration-refugees-citizenship/services/visit-canada.html",t:"canada.ca"},
 res:q(["العمل والدراسة يحتاجان تصريحاً خاصاً، وكندا خفّضت أعداد الطلاب والعمال المؤقتين منذ 2024."],["Work and study need their own permits; Canada has cut temporary student and worker numbers since 2024."],["Travail et études exigent un permis spécifique ; le Canada réduit le nombre d'étudiants et de travailleurs temporaires depuis 2024."],["Arbeit und Studium brauchen eigene Genehmigungen; Kanada senkt seit 2024 die Zahl befristeter Studierender und Arbeitskräfte."]),
 resSrc:{u:"https://www.canada.ca/en/services/immigration-citizenship.html",t:"canada.ca"},
 money:q(["يجب التصريح عن 10,000 دولار كندي أو أكثر نقداً."],["Declare CAD 10,000 or more in cash."],["Déclarez 10 000 $ CA ou plus en espèces."],["Bargeld ab 10.000 CAD anmelden."]),
 drive:q(["السرعة بالكيلومتر: 50 في المدن غالباً، 80 إلى 90 خارجها، 100 إلى 110 على الطرق السريعة.","في مونتريال الانعطاف يميناً عند الإشارة الحمراء ممنوع."],["Limits in km/h: usually 50 in towns, 80–90 outside, 100–110 on highways.","In Montreal, turning right on a red light is banned."],["Limites en km/h : 50 en ville, 80–90 hors agglomération, 100–110 sur autoroute.","À Montréal, tourner à droite au feu rouge est interdit."],["Tempolimits in km/h: meist 50 innerorts, 80–90 außerorts, 100–110 auf Autobahnen.","In Montreal ist Rechtsabbiegen bei Rot verboten."]),
 laws:q(["الحشيش قانوني داخل كندا، لكن إدخاله أو إخراجه عبر الحدود جريمة.","العمر القانوني للكحول 18 أو 19 حسب المقاطعة."],["Cannabis is legal inside Canada, but taking it across the border is a crime.","The legal drinking age is 18 or 19 depending on the province."],["Le cannabis est légal au Canada, mais lui faire passer la frontière est un délit.","L'âge légal pour l'alcool est de 18 ou 19 ans selon la province."],["Cannabis ist in Kanada legal, die Mitnahme über die Grenze aber strafbar.","Das Mindestalter für Alkohol ist je nach Provinz 18 oder 19."]),
 warn:q(["الشتاء قاسٍ جداً؛ إطارات الشتاء إلزامية في كيبيك من 1 ديسمبر إلى 15 مارس."],["Winters are harsh; winter tyres are mandatory in Quebec from 1 Dec to 15 Mar."],["Les hivers sont rudes ; les pneus d'hiver sont obligatoires au Québec du 1er déc. au 15 mars."],["Die Winter sind hart; in Québec gilt vom 1. Dez. bis 15. März Winterreifenpflicht."]),
