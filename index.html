const WARN={
gb:W(["لا تطلب الـ ETA إلا من gov.uk أو التطبيق الرسمي، فالمواقع المقلدة تأخذ أضعاف السعر.","في لندن ينتشر خطف الهواتف من لصوص على دراجات؛ لا تمسك هاتفك قرب حافة الرصيف.","اركب سيارات الأجرة السوداء المرخصة أو سيارة محجوزة مسبقاً فقط، والسائقون الذين يعرضون التوصيل في الشارع ليلاً غير مرخصين.","مزدوجو الجنسية البريطانية لا يستطيعون طلب ETA ويحتاجون جوازاً بريطانياً."],
 ["Apply for the ETA only on gov.uk or the official app; copycat sites charge several times more.","In London, phone snatching by thieves on bikes is common; don't hold your phone near the kerb.","Use licensed black cabs or pre-booked cars only; drivers touting for fares on the street at night are unlicensed.","British dual nationals cannot get an ETA and need a British passport."],
 ["Demandez l'ETA uniquement sur gov.uk ou l'appli officielle ; les sites copiés facturent plusieurs fois plus.","À Londres, les vols de téléphones par des voleurs à vélo sont fréquents ; ne tenez pas votre téléphone près du trottoir.","Prenez uniquement les black cabs ou des voitures réservées ; les chauffeurs qui racolent dans la rue la nuit ne sont pas autorisés.","Les binationaux britanniques ne peuvent pas obtenir d'ETA et doivent voyager avec un passeport britannique."],
 ["Beantragen Sie die ETA nur über gov.uk oder die offizielle App; Kopierseiten verlangen ein Vielfaches.","In London reißen Diebe auf Fahrrädern oft Handys weg; Handy nicht nah an der Bordsteinkante halten.","Nur lizenzierte Black Cabs oder vorgebuchte Wagen nutzen; nachts auf der Straße werbende Fahrer sind nicht lizenziert.","Britische Doppelstaatler bekommen keine ETA und brauchen einen britischen Pass."]),
fr:W(["احذر النشالين في المترو وعند برج إيفل واللوفر ومونمارتر.","حيل العرائض والأساور و«الخاتم الذهبي الذي وجدته»: يقترب منك شخص ثم يطلب مالاً؛ تجاهله وامشِ.","اركب سيارات الأجرة الرسمية من الطابور فقط؛ من المطار إلى باريس سعر ثابت، وتجاهل من يعرض التوصيل داخل الصالة."],
 ["Watch for pickpockets on the Metro and at the Eiffel Tower, the Louvre and Montmartre.","Petition, bracelet and 'found gold ring' tricks: someone approaches, then asks for money; ignore them and walk on.","Take official taxis from the rank only; airport-to-Paris fares are fixed, and ignore drivers offering rides inside the terminal."],
 ["Attention aux pickpockets dans le métro, à la tour Eiffel, au Louvre et à Montmartre.","Arnaques à la pétition, au bracelet et à la « bague en or trouvée » : on vous aborde puis on demande de l'argent ; ignorez et continuez.","Prenez uniquement les taxis officiels à la station ; les trajets aéroport-Paris sont à prix fixe, ignorez les chauffeurs qui racolent dans le terminal."],
 ["Vorsicht vor Taschendieben in der Metro, am Eiffelturm, im Louvre und in Montmartre.","Petitions-, Armband- und „gefundener Goldring“-Tricks: Man wird angesprochen und soll zahlen; ignorieren und weitergehen.","Nur offizielle Taxis am Taxistand nehmen; Flughafen–Paris hat Festpreise, Fahrer, die im Terminal werben, ignorieren."]),
de:W(["الرموز والتحيات النازية ممنوعة قانوناً حتى على سبيل المزاح.","مفتشو التذاكر يرتدون ملابس عادية، والركوب بلا تذكرة صالحة غرامته نحو 60 يورو. فعّل التذكرة حيث يُطلب ذلك.","احذر «الشرطة المزيفة» التي تطلب فحص محفظتك؛ الشرطة الحقيقية لا تطلب نقودك أو رقمك السري، فاطلب رؤية الهوية."],
 ["Nazi symbols and salutes are illegal, even as a joke.","Ticket inspectors wear plain clothes; riding without a valid ticket costs about €60. Validate tickets where required.","Beware 'fake police' asking to check your wallet; real police never ask for your cash or PIN, so ask to see ID."],
 ["Les symboles et saluts nazis sont illégaux, même pour plaisanter.","Les contrôleurs sont en civil ; voyager sans titre valable coûte environ 60 €. Compostez quand c'est exigé.","Méfiez-vous des « faux policiers » qui veulent vérifier votre portefeuille ; la vraie police ne demande ni argent ni code, exigez une carte."],
 ["NS-Symbole und Gesten sind verboten, auch als Scherz.","Kontrolleure sind in Zivil; Fahren ohne gültiges Ticket kostet rund 60 €. Tickets wo nötig entwerten.","Vorsicht vor „falschen Polizisten“, die Ihre Geldbörse prüfen wollen; echte Polizei verlangt nie Bargeld oder PIN, Ausweis zeigen lassen."]),
es:W(["سرقة الهواتف والحقائب شائعة في برشلونة (لا رامبلا والمترو) ومدريد.","حيل الإلهاء: شخص يشير إلى «بقعة» على ملابسك أو يسألك عن الطريق بخريطة بينما يسرقك آخر.","في إشبيلية وغرناطة: نساء يعطينك غصن إكليل الجبل ثم يطلبن المال؛ ارفض بأدب ولا تأخذه."],
 ["Phone and bag theft is common in Barcelona (Las Ramblas, Metro) and Madrid.","Distraction tricks: someone points out a 'stain' on your clothes or asks directions with a map while another robs you.","In Seville and Granada, women hand you rosemary then demand money; politely refuse and don't take it."],
 ["Les vols de téléphones et de sacs sont fréquents à Barcelone (Rambla, métro) et Madrid.","Diversions : quelqu'un signale une « tache » sur vos vêtements ou demande son chemin avec une carte pendant qu'un complice vous vole.","À Séville et Grenade, des femmes offrent du romarin puis réclament de l'argent ; refusez poliment sans le prendre."],
 ["Handy- und Taschendiebstahl ist in Barcelona (Ramblas, Metro) und Madrid häufig.","Ablenkungstricks: Jemand zeigt auf einen „Fleck“ oder fragt mit Karte nach dem Weg, während ein anderer stiehlt.","In Sevilla und Granada drücken Frauen einem Rosmarin in die Hand und verlangen Geld; höflich ablehnen, nicht annehmen."]),
it:W(["في روما: أشخاص بزي المصارعين أو يقدمون أساور وورداً «هدية» ثم يطلبون المال؛ ارفض بحزم.","اسأل عن الأسعار ورسم الخدمة (coperto) قبل الطلب، فقوائم المطاعم السياحية بلا أسعار قد تكون مكلفة جداً.","النشالون كثيرون في محطة تيرميني والحافلة 64 والمترو.","اشترِ تذاكر القطار والحافلة وفعّلها قبل الركوب."],
 ["In Rome, costumed 'gladiators' or people offering 'free' bracelets and roses then demand money; refuse firmly.","Check prices and the cover charge (coperto) before ordering; tourist menus without prices can be very expensive.","Pickpockets are common at Termini station, on bus 64 and the Metro.","Buy and validate train and bus tickets before boarding."],
 ["À Rome, des « gladiateurs » costumés ou des vendeurs de bracelets et roses « offerts » réclament ensuite de l'argent ; refusez fermement.","Vérifiez les prix et le couvert (coperto) avant de commander ; les menus touristiques sans prix peuvent coûter très cher.","Pickpockets fréquents à la gare Termini, dans le bus 64 et le métro.","Achetez et validez vos billets de train et de bus avant de monter."],
 ["In Rom verlangen kostümierte „Gladiatoren“ oder Verteiler „geschenkter“ Armbänder und Rosen danach Geld; bestimmt ablehnen.","Preise und Gedeckpreis (coperto) vor der Bestellung prüfen; Touristenmenüs ohne Preise können sehr teuer sein.","Viele Taschendiebe am Bahnhof Termini, im Bus 64 und in der Metro.","Zug- und Bustickets vor dem Einsteigen kaufen und entwerten."]),
nl:W(["لا تمشِ في مسارات الدراجات، فللدراجات الأولوية.","سرقة الدراجات شائعة جداً؛ اقفل دراجتك المستأجرة بقفلين.","لا تشترِ أي شيء من مروجي الشارع في أمستردام؛ بيعت مواد خطرة على أنها مخدرات أخرى وتسببت في وفيات."],
 ["Don't walk on bike lanes; cyclists have priority.","Bike theft is very common; lock your rental bike with two locks.","Never buy anything from street dealers in Amsterdam; dangerous substances have been sold as other drugs and caused deaths."],
 ["Ne marchez pas sur les pistes cyclables ; les cyclistes sont prioritaires.","Les vols de vélos sont très fréquents ; attachez votre vélo de location avec deux antivols.","N'achetez jamais rien aux dealers de rue à Amsterdam ; des substances dangereuses vendues pour d'autres ont causé des décès."],
 ["Nicht auf Radwegen gehen; Radfahrer haben Vorrang.","Fahrraddiebstahl ist sehr häufig; Leihrad mit zwei Schlössern sichern.","In Amsterdam nie etwas von Straßendealern kaufen; gefährliche Stoffe wurden als andere Drogen verkauft und führten zu Todesfällen."]),
at:W(["إطارات الشتاء إلزامية في ظروف الشتاء من نوفمبر إلى أبريل.","اشترِ ملصق الطرق السريعة من متجر ASFINAG الرسمي أو محطات الوقود؛ المواقع غير الرسمية تأخذ رسوماً إضافية.","لعبة «الأكواب الثلاثة» في شوارع فيينا مزوّرة دائماً، ومن حولها شركاء للنصب."],
 ["Winter tyres are compulsory in winter conditions from November to April.","Buy the motorway vignette from the official ASFINAG shop or petrol stations; unofficial sites add fees.","The street 'shell game' in Vienna is always rigged, and the crowd around it are accomplices."],
 ["Les pneus hiver sont obligatoires par conditions hivernales de novembre à avril.","Achetez la vignette autoroutière sur la boutique officielle ASFINAG ou en station-service ; les sites non officiels ajoutent des frais.","Le « jeu des gobelets » dans les rues de Vienne est toujours truqué, et l'attroupement est complice."],
 ["Bei winterlichen Verhältnissen gilt von November bis April Winterreifenpflicht.","Vignette nur im offiziellen ASFINAG-Shop oder an Tankstellen kaufen; inoffizielle Seiten verlangen Aufschläge.","Das „Hütchenspiel“ in Wiens Straßen ist immer manipuliert, die Umstehenden sind Komplizen."]),
ch:W(["اشترِ ملصق الطرق السريعة الإلكتروني من الموقع الرسمي via.admin.ch فقط، فالمواقع الأخرى تأخذ أضعاف السعر.","في الجبال يتغير الطقس بسرعة؛ لا تخرج عن المسارات المعلّمة وراجع تحذيرات الانهيارات الثلجية.","الأسعار مرتفعة جداً، فخطط لميزانيتك مسبقاً."],
 ["Buy the e-vignette only on the official via.admin.ch site; other sites charge several times more.","Mountain weather changes fast; stay on marked trails and check avalanche warnings.","Prices are very high; plan your budget ahead."],
 ["Achetez l'e-vignette uniquement sur le site officiel via.admin.ch ; les autres sites facturent plusieurs fois plus.","En montagne, la météo change vite ; restez sur les sentiers balisés et consultez les bulletins d'avalanche.","Les prix sont très élevés ; prévoyez votre budget."],
 ["E-Vignette nur auf der offiziellen Seite via.admin.ch kaufen; andere Seiten verlangen ein Vielfaches.","In den Bergen schlägt das Wetter schnell um; auf markierten Wegen bleiben und Lawinenbulletins prüfen.","Die Preise sind sehr hoch; Budget vorab planen."]),
gr:W(["في أثينا: غريب ودود يدعوك إلى بار، ثم تأتي فاتورة ضخمة مع تهديد؛ لا تقبل الدعوات من الغرباء.","تأكد أن عدّاد التاكسي يعمل، فمن مطار أثينا إلى وسط المدينة سعر ثابت.","النشالون كثيرون في خط المترو 1 (بيرايوس–كيفيسيا).","في الصيف تُفرض غرامات كبيرة على إشعال النار في الغابات أو التسبب بها."],
 ["In Athens, a friendly stranger invites you to a bar, then a huge bill arrives with threats; don't accept invites from strangers.","Make sure the taxi meter is on; Athens airport to the centre has a fixed fare.","Pickpockets are common on Metro line 1 (Piraeus–Kifissia).","In summer, heavy fines apply for lighting or causing forest fires."],
 ["À Athènes, un inconnu sympathique vous invite dans un bar, puis arrive une note énorme et des menaces ; refusez les invitations d'inconnus.","Vérifiez que le compteur du taxi tourne ; l'aéroport d'Athènes–centre est à prix fixe.","Pickpockets fréquents sur la ligne 1 du métro (Le Pirée–Kifissia).","En été, de lourdes amendes s'appliquent pour tout feu en forêt."],
 ["In Athen lädt ein freundlicher Fremder in eine Bar ein, dann kommt eine riesige Rechnung mit Drohungen; Einladungen Fremder ablehnen.","Taxameter muss laufen; Flughafen Athen–Zentrum hat einen Festpreis.","Viele Taschendiebe in der Metrolinie 1 (Piräus–Kifissia).","Im Sommer drohen hohe Strafen für Feuer in Wäldern."]),
tr:W(["احذر المواقع المزيفة للفيزا الإلكترونية؛ الموقع الرسمي evisa.gov.tr فقط.","في إسطنبول: ماسح أحذية «يُسقط فرشاته» لتعيدها ثم يطلب مالاً، وغرباء يدعونك إلى بار ثم فاتورة ضخمة.","اطلب تشغيل العدّاد أو استخدم تطبيقاً مثل BiTaksi، وانتبه لحيلة تبديل ورقة 200 ليرة بورقة 20."],
 ["Beware fake e-Visa sites; the only official one is evisa.gov.tr.","In Istanbul: a shoe-shiner 'drops his brush' so you return it, then demands money; strangers invite you to a bar, then a huge bill.","Insist on the meter or use an app like BiTaksi, and watch for the trick of swapping your 200-lira note for a 20."],
 ["Méfiez-vous des faux sites d'e-Visa ; le seul officiel est evisa.gov.tr.","À Istanbul : un cireur « fait tomber sa brosse » pour que vous la rameniez, puis réclame de l'argent ; des inconnus vous invitent dans un bar, puis note énorme.","Exigez le compteur ou utilisez une appli comme BiTaksi, et attention à l'échange d'un billet de 200 livres contre un de 20."],
 ["Vorsicht vor gefälschten E-Visum-Seiten; offiziell ist nur evisa.gov.tr.","In Istanbul: Schuhputzer „verliert“ seine Bürste, damit man sie zurückgibt, und verlangt Geld; Fremde laden in Bars ein, dann riesige Rechnung.","Auf Taxameter bestehen oder App wie BiTaksi nutzen; Vorsicht beim Trick, einen 200-Lira-Schein gegen 20 zu tauschen."]),
ae:W(["بعض الأدوية الشائعة (مثل التي تحتوي على الكودايين) تحتاج تصريحاً مسبقاً. احمل الوصفة الطبية.","المخدرات بكل أنواعها عقوبتها شديدة، حتى الكميات الصغيرة.","احذر عروض العمل والكفالة التي تطلب دفع مال مقدماً، والإعلانات المزيفة لتأجير الشقق.","مكالمات أو رسائل باسم الشرطة أو البنك تطلب رمز بطاقتك أو OTP احتيال دائماً."],
 ["Some common medicines (e.g. with codeine) need prior approval; carry your prescription.","Penalties for any drugs are severe, even for tiny amounts.","Beware job or visa-sponsorship offers asking for upfront payment, and fake holiday-rental listings.","Calls or messages claiming to be police or your bank asking for card codes or an OTP are always scams."],
 ["Certains médicaments courants (avec codéine, par ex.) exigent une autorisation préalable ; ayez votre ordonnance.","Les peines pour toute drogue sont sévères, même pour de très petites quantités.","Méfiez-vous des offres d'emploi ou de parrainage de visa payantes d'avance et des fausses annonces de location.","Les appels ou messages se disant de la police ou de la banque et demandant un code de carte ou un OTP sont toujours des arnaques."],
 ["Manche gängige Medikamente (z. B. mit Codein) brauchen eine Vorabgenehmigung; Rezept mitführen.","Drogendelikte werden hart bestraft, auch bei kleinsten Mengen.","Vorsicht bei Job- oder Visa-Sponsoring-Angeboten mit Vorauszahlung und gefälschten Ferienwohnungsanzeigen.","Anrufe oder Nachrichten angeblich von Polizei oder Bank, die Kartencodes oder OTP verlangen, sind immer Betrug."]),
sa:W(["اطلب الفيزا من visa.visitsaudi.com أو منصة وزارة الخارجية فقط، واحذر الوكالات والمواقع المزيفة.","احجز العمرة عبر منصة نُسك والشركات المرخصة فقط؛ باقات الحج «بدون تصريح» احتيال وعقوبتها غرامة وترحيل.","المخدرات عقوبتها شديدة جداً.","تصوير المباني الحكومية والأشخاص دون إذن ممنوع."],
 ["Apply for visas only at visa.visitsaudi.com or the foreign ministry platform; beware fake agencies and sites.","Book Umrah only via the Nusuk platform and licensed companies; 'no-permit' Hajj packages are scams and bring fines and deportation.","Drug penalties are extremely severe.","Do not photograph government buildings or people without permission."],
 ["Demandez le visa uniquement sur visa.visitsaudi.com ou la plateforme du ministère ; méfiez-vous des fausses agences.","Réservez la Omra uniquement via Nusuk et des sociétés agréées ; les forfaits Hajj « sans permis » sont des arnaques passibles d'amende et d'expulsion.","Les peines liées à la drogue sont extrêmement sévères.","Ne photographiez pas les bâtiments officiels ni les personnes sans autorisation."],
 ["Visum nur über visa.visitsaudi.com oder die Plattform des Außenministeriums beantragen; Vorsicht vor falschen Agenturen.","Umrah nur über Nusuk und lizenzierte Firmen buchen; Hadsch-Pakete „ohne Genehmigung“ sind Betrug und führen zu Strafe und Abschiebung.","Drogendelikte werden extrem hart bestraft.","Keine Regierungsgebäude oder Personen ohne Erlaubnis fotografieren."]),
qa:W(["اطلب تصريح Hayya من hayya.qa فقط، فالمواقع الوسيطة تأخذ رسوماً غير لازمة.","السجائر الإلكترونية ممنوعة وقد تُصادر في المطار.","المخدرات عقوبتها شديدة جداً."],
 ["Apply for Hayya only at hayya.qa; middleman sites charge unnecessary fees.","E-cigarettes are banned and may be seized at the airport.","Drug penalties are very severe."],
 ["Demandez Hayya uniquement sur hayya.qa ; les intermédiaires facturent des frais inutiles.","Les cigarettes électroniques sont interdites et peuvent être saisies à l'aéroport.","Les peines liées à la drogue sont très sévères."],
 ["Hayya nur über hayya.qa beantragen; Vermittlerseiten verlangen unnötige Gebühren.","E-Zigaretten sind verboten und können am Flughafen beschlagnahmt werden.","Drogendelikte werden sehr hart bestraft."]),
om:W(["لا تعبر الأودية عند المطر، فالسيول المفاجئة خطيرة.","في الصحراء والطرق الوعرة سافر مع سيارة ثانية، واحمل ماءً كافياً، وأخبر أحداً بخط سيرك.","اطلب الفيزا من evisa.rop.gov.om فقط."],
 ["Never cross wadis in rain; flash floods are deadly.","In the desert and off-road, travel with a second car, carry plenty of water and tell someone your route.","Apply for visas only at evisa.rop.gov.om."],
 ["Ne traversez jamais un wadi sous la pluie ; les crues subites sont mortelles.","Dans le désert et hors piste, partez à deux véhicules, emportez beaucoup d'eau et indiquez votre itinéraire à quelqu'un.","Demandez le visa uniquement sur evisa.rop.gov.om."],
 ["Wadis bei Regen nie durchqueren; Sturzfluten sind lebensgefährlich.","In der Wüste und im Gelände mit zweitem Auto fahren, viel Wasser mitnehmen und die Route jemandem mitteilen.","Visum nur über evisa.rop.gov.om beantragen."]),
jo:W(["بعض المناطق الحدودية مغلقة، فلا تقترب منها دون مرشد.","في البتراء اتفق على سعر ركوب الحمار أو الخيل قبل البدء، فبعضهم يطلب أضعافه في النهاية.","في وادي رم احجز مع مخيمات مرخصة، وفي عمّان اطلب تشغيل عدّاد التاكسي."],
 ["Some border areas are closed; don't approach them without a guide.","In Petra, agree the price for donkey or horse rides before starting; some demand several times more at the end.","In Wadi Rum book licensed camps, and in Amman ask for the taxi meter."],
 ["Certaines zones frontalières sont fermées ; ne vous en approchez pas sans guide.","À Pétra, fixez le prix des balades à âne ou à cheval avant de partir ; certains réclament beaucoup plus à l'arrivée.","À Wadi Rum, réservez des camps agréés, et à Amman demandez le compteur du taxi."],
 ["Einige Grenzgebiete sind gesperrt; ohne Führer nicht annähern.","In Petra den Preis für Esel- oder Pferderitte vorher vereinbaren; manche verlangen am Ende ein Vielfaches.","Im Wadi Rum lizenzierte Camps buchen, in Amman auf Taxameter bestehen."]),
eg:W(["عند الأهرامات: «صورة مجانية» مع جمل أو «هدية» ثم طلب مال؛ لا تقبل شيئاً لم تتفق على سعره.","اشترِ التذاكر من الشبابيك الرسمية فقط واستعن بمرشدين مرخصين؛ «الموقع مغلق اليوم» حيلة لأخذك إلى محل.","محلات البردي والعطور التي يأخذك إليها السائق تدفع له عمولة، والأسعار فيها مرتفعة.","إخراج الآثار أو شراؤها جريمة."],
 ["At the pyramids: a 'free photo' on a camel or a 'gift', then a demand for money; accept nothing without an agreed price.","Buy tickets only at official windows and use licensed guides; 'the site is closed today' is a trick to take you to a shop.","Papyrus and perfume shops your driver takes you to pay him commission and charge high prices.","Buying or exporting antiquities is a crime."],
 ["Aux pyramides : « photo gratuite » sur un chameau ou « cadeau », puis on réclame de l'argent ; n'acceptez rien sans prix convenu.","Achetez les billets uniquement aux guichets officiels et prenez des guides agréés ; « le site est fermé aujourd'hui » est une ruse pour vous emmener dans une boutique.","Les boutiques de papyrus et de parfums où vous emmène le chauffeur lui versent une commission et pratiquent des prix élevés.","Acheter ou exporter des antiquités est un délit."],
 ["An den Pyramiden: „Gratisfoto“ auf dem Kamel oder „Geschenk“, dann wird Geld verlangt; nichts ohne vereinbarten Preis annehmen.","Tickets nur an offiziellen Schaltern kaufen, lizenzierte Führer nehmen; „Heute geschlossen“ ist ein Trick, um Sie in einen Laden zu bringen.","Papyrus- und Parfümläden, zu denen der Fahrer Sie bringt, zahlen ihm Provision und sind teuer.","Kauf oder Ausfuhr von Antiquitäten ist strafbar."]),
ma:W(["احذر المرشدين غير الرسميين في المدن القديمة (فاس ومراكش).","حيلة «الطريق مغلق» أو «الساحة من هنا» تقودك إلى محل أو تنتهي بطلب مال.","في ساحة جامع الفنا: نساء يرسمن الحناء على يدك دون إذن، وأصحاب القردة والأفاعي يطلبون مالاً مقابل الصور.","اطلب تشغيل عدّاد «التاكسي الصغير» داخل المدن."],
 ["Be wary of unofficial guides in the old medinas (Fes, Marrakech).","'The road is closed' or 'the square is this way' tricks lead you to a shop or end with a demand for money.","On Jemaa el-Fna, women paint henna on your hand without asking, and monkey and snake handlers demand money for photos.","Ask for the meter in 'petit taxis' in town."],
 ["Méfiez-vous des faux guides dans les médinas (Fès, Marrakech).","Les ruses « la rue est fermée » ou « la place, c'est par ici » mènent à une boutique ou à une demande d'argent.","Sur Jemaa el-Fna, des femmes posent du henné sans demander, et les montreurs de singes et de serpents exigent de l'argent pour les photos.","Exigez le compteur dans les petits taxis en ville."],
 ["Vorsicht vor inoffiziellen Führern in den Medinas (Fès, Marrakesch).","Tricks wie „Die Straße ist gesperrt“ oder „Der Platz ist hier lang“ führen in einen Laden oder enden mit Geldforderung.","Auf dem Djemaa el-Fna malen Frauen ungefragt Henna, Affen- und Schlangenhalter verlangen Geld für Fotos.","In Petits Taxis in der Stadt auf Taxameter bestehen."]),
my:W(["بطاقة MDAC مجانية على موقع الهجرة الماليزية؛ المواقع التي تطلب رسوماً مزيفة.","استخدم تطبيق Grab بدل سيارات الأجرة بلا عدّاد.","في كوالالمبور يخطف لصوص على دراجات نارية الحقائب؛ احمل حقيبتك بعيداً عن الشارع.","عقوبات تهريب المخدرات شديدة جداً وقد تصل إلى الإعدام."],
 ["The MDAC card is free on the Malaysian Immigration site; sites charging a fee are fake.","Use the Grab app rather than unmetered taxis.","In Kuala Lumpur, motorbike thieves snatch bags; carry yours on the side away from the road.","Drug trafficking penalties are extremely severe and can include the death penalty."],
 ["La carte MDAC est gratuite sur le site de l'immigration malaisienne ; les sites payants sont faux.","Utilisez l'appli Grab plutôt que des taxis sans compteur.","À Kuala Lumpur, des voleurs à moto arrachent les sacs ; portez le vôtre côté opposé à la rue.","Le trafic de drogue est puni très sévèrement, peine de mort comprise."],
 ["Die MDAC-Karte ist auf der Seite der malaysischen Einwanderungsbehörde kostenlos; Seiten mit Gebühr sind gefälscht.","Grab-App statt Taxis ohne Taxameter nutzen.","In Kuala Lumpur reißen Motorraddiebe Taschen weg; Tasche auf der straßenabgewandten Seite tragen.","Drogenhandel wird extrem hart bestraft, bis hin zur Todesstrafe."]),
ge:W(["في تبليسي: فتيات أو غرباء يدعونك إلى بار ثم تأتي فاتورة بآلاف الدولارات مع تهديد؛ حذّرت السفارة السعودية منها، ولا تقبل هذه الدعوات.","اطلب قائمة الأسعار قبل الطلب، واتصل بالشرطة 112 إذا أُجبرت على الدفع.","احمل وثيقة التأمين الصحي معك، فقد تُطلب عند الحدود."],
 ["In Tbilisi, women or strangers invite you to a bar and then a bill of thousands of dollars arrives with threats; the Saudi embassy has warned about it, so decline these invites.","Ask for the menu with prices before ordering, and call police on 112 if forced to pay.","Carry proof of health insurance; it may be checked at the border."],
 ["À Tbilissi, des femmes ou des inconnus vous invitent dans un bar, puis arrive une note de milliers de dollars avec menaces ; l'ambassade saoudienne a alerté, refusez ces invitations.","Demandez la carte avec les prix avant de commander et appelez la police au 112 si on vous force à payer.","Ayez la preuve d'assurance santé sur vous ; elle peut être contrôlée à la frontière."],
 ["In Tiflis laden Frauen oder Fremde in eine Bar ein, dann kommt eine Rechnung über Tausende Dollar mit Drohungen; die saudische Botschaft warnt davor, also ablehnen.","Vor der Bestellung die Karte mit Preisen verlangen und bei Zahlungszwang die Polizei unter 112 rufen.","Nachweis der Krankenversicherung mitführen; er kann an der Grenze geprüft werden."]),
us:W(["اطلب ESTA من esta.cbp.dhs.gov فقط؛ المواقع الأخرى تأخذ أضعاف السعر.","مكالمات من «الهجرة» أو «الشرطة» تطلب الدفع ببطاقات هدايا أو تحويل احتيال دائماً.","الكذب في استمارة الدخول أو الفيزا قد يؤدي إلى منع دائم.","يحق لضباط الحدود تفتيش الهاتف والأجهزة."],
 ["Apply for ESTA only at esta.cbp.dhs.gov; other sites charge several times more.","Calls from 'immigration' or 'police' demanding payment by gift card or transfer are always scams.","Lying on entry or visa forms can lead to a permanent ban.","Border officers may inspect phones and devices."],
 ["Demandez l'ESTA uniquement sur esta.cbp.dhs.gov ; les autres sites facturent plusieurs fois plus.","Les appels de « l'immigration » ou de « la police » exigeant un paiement en cartes cadeaux ou virement sont toujours des arnaques.","Mentir sur un formulaire d'entrée ou de visa peut valoir une interdiction définitive.","Les agents frontaliers peuvent inspecter téléphones et appareils."],
 ["ESTA nur über esta.cbp.dhs.gov beantragen; andere Seiten verlangen ein Vielfaches.","Anrufe von „Einwanderungsbehörde“ oder „Polizei“, die Zahlung per Geschenkkarte oder Überweisung fordern, sind immer Betrug.","Falschangaben in Einreise- oder Visaformularen können zu einer dauerhaften Sperre führen.","Grenzbeamte dürfen Handys und Geräte durchsuchen."]),
kw:W(["اطلب الفيزا من evisa.moi.gov.kw فقط، واحذر المكاتب التي تعد بفيزا مقابل مبالغ كبيرة.","المخدرات عقوبتها شديدة جداً، واحمل وصفة طبية لأي دواء.","حرارة الصيف قد تتجاوز 50 درجة، فتجنب الخروج وقت الظهيرة."],
 ["Apply only at evisa.moi.gov.kw, and beware agencies promising visas for large sums.","Drug penalties are very severe; carry prescriptions for any medicine.","Summer heat can exceed 50°C; avoid going out at midday."],
 ["Demandez le visa uniquement sur evisa.moi.gov.kw et méfiez-vous des agences promettant un visa contre de grosses sommes.","Les peines liées à la drogue sont très sévères ; ayez l'ordonnance de vos médicaments.","En été, la chaleur peut dépasser 50 °C ; évitez de sortir à midi."],
 ["Nur über evisa.moi.gov.kw beantragen; Vorsicht vor Agenturen, die Visa gegen hohe Summen versprechen.","Drogendelikte werden sehr hart bestraft; Rezepte für Medikamente mitführen.","Im Sommer sind über 50 °C möglich; mittags nicht draußen sein."]),
bh:W(["اطلب الفيزا من evisa.gov.bh فقط.","المخدرات عقوبتها شديدة جداً.","تجنب التجمعات والمظاهرات."],
 ["Apply for visas only at evisa.gov.bh.","Drug penalties are very severe.","Avoid gatherings and demonstrations."],
 ["Demandez le visa uniquement sur evisa.gov.bh.","Les peines liées à la drogue sont très sévères.","Évitez les rassemblements et manifestations."],
 ["Visum nur über evisa.gov.bh beantragen.","Drogendelikte werden sehr hart bestraft.","Menschenansammlungen und Demonstrationen meiden."]),
lb:W(["راجع تحذيرات السفر الرسمية قبل الذهاب، فالوضع الأمني في الجنوب والبقاع قد يتغير بسرعة.","اصرف العملة لدى الصرافين المرخصين فقط، وأوراق الدولار القديمة أو الممزقة قد تُرفض.","اتفق على سعر «السرفيس» أو التاكسي قبل الركوب."],
 ["Check official travel advice before going; security in the south and the Bekaa can change quickly.","Change money only at licensed exchangers; old or torn dollar notes may be refused.","Agree the 'service' taxi or cab fare before getting in."],
 ["Consultez les conseils aux voyageurs officiels ; la sécurité au sud et dans la Bekaa peut changer vite.","Changez uniquement chez des changeurs agréés ; les vieux billets ou billets abîmés peuvent être refusés.","Fixez le prix du « service » ou du taxi avant de monter."],
 ["Vor der Reise offizielle Reisehinweise prüfen; die Lage im Süden und in der Bekaa kann sich schnell ändern.","Geld nur bei lizenzierten Wechselstuben tauschen; alte oder beschädigte Dollarscheine werden oft abgelehnt.","Preis für Sammeltaxi („Service“) oder Taxi vor dem Einsteigen vereinbaren."]),
tn:W(["تجنب المناطق الحدودية مع ليبيا والجزائر والمناطق الجبلية العسكرية.","في المدن القديمة: «دليل» يأخذك إلى «متحف السجاد» أو محل، ثم ضغط للشراء.","اطلب تشغيل عدّاد التاكسي."],
 ["Avoid the border areas with Libya and Algeria and the military mountain zones.","In the medinas, a 'guide' takes you to a 'carpet museum' or shop, followed by pressure to buy.","Ask for the taxi meter."],
 ["Évitez les zones frontalières avec la Libye et l'Algérie et les zones militaires de montagne.","Dans les médinas, un « guide » vous mène à un « musée du tapis » ou une boutique, puis pression pour acheter.","Exigez le compteur du taxi."],
 ["Grenzgebiete zu Libyen und Algerien sowie militärische Bergzonen meiden.","In den Medinas führt ein „Führer“ in ein „Teppichmuseum“ oder einen Laden, dann folgt Kaufdruck.","Auf Taxameter bestehen."]),
az:W(["اطلب فيزا ASAN من evisa.gov.az فقط، فالمواقع المقلدة تأخذ أضعاف السعر.","استخدم تطبيقات سيارات الأجرة لتجنب المبالغة في الأسعار.","اصرف العملة في البنوك ومكاتب الصرافة فقط، لا في الشارع."],
 ["Apply for the ASAN visa only at evisa.gov.az; copycat sites charge several times more.","Use ride-hailing apps to avoid taxi overcharging.","Change money only at banks and exchange offices, never on the street."],
 ["Demandez le visa ASAN uniquement sur evisa.gov.az ; les sites copiés facturent plusieurs fois plus.","Utilisez les applis de VTC pour éviter les taxis trop chers.","Changez l'argent uniquement en banque ou en bureau de change, jamais dans la rue."],
 ["ASAN-Visum nur über evisa.gov.az beantragen; Kopierseiten verlangen ein Vielfaches.","Fahrdienst-Apps nutzen, um überhöhte Taxipreise zu vermeiden.","Geld nur in Banken und Wechselstuben tauschen, nie auf der Straße."]),
th:W(["بطاقة TDAC مجانية على tdac.immigration.go.th؛ نحو 10% من الزوار استخدموا مواقع مزيفة تأخذ رسوماً.","حيلة «القصر الكبير مغلق اليوم» تنتهي بجولة توك توك إلى محلات مجوهرات مزيفة.","عند استئجار جيت سكي أو دراجة صوّرها قبل الاستلام، ولا تترك جوازك كرهن.","إهانة الملك جريمة، والسجائر الإلكترونية ممنوعة."],
 ["The TDAC is free at tdac.immigration.go.th; about 10% of visitors used fake sites that charge fees.","The 'Grand Palace is closed today' trick ends in a tuk-tuk tour to fake gem shops.","When renting a jet ski or scooter, photograph it first and never leave your passport as a deposit.","Insulting the King is a crime, and e-cigarettes are banned."],
 ["La TDAC est gratuite sur tdac.immigration.go.th ; environ 10 % des visiteurs ont utilisé de faux sites payants.","La ruse « le Grand Palais est fermé aujourd'hui » finit en tuk-tuk vers de fausses bijouteries.","En louant un jet-ski ou un scooter, photographiez-le avant et ne laissez jamais votre passeport en caution.","Insulter le roi est un délit, et les cigarettes électroniques sont interdites."],
 ["Die TDAC ist auf tdac.immigration.go.th kostenlos; rund 10 % der Besucher nutzten gefälschte, kostenpflichtige Seiten.","Der Trick „Der Große Palast ist heute geschlossen“ endet mit einer Tuk-Tuk-Fahrt zu falschen Juwelieren.","Jetski oder Roller vor der Miete fotografieren und nie den Pass als Pfand lassen.","Beleidigung des Königs ist strafbar, E-Zigaretten sind verboten."]),
id:W(["ادفع رسم بالي من love.bali.gov.id فقط؛ انتشرت روابط مزيفة وخصم مزدوج.","لا تشرب الكوكتيلات الرخيصة أو مشروب «آراك» مجهول المصدر؛ تسمم الميثانول تسبب في وفيات سياح.","اصرف العملة لدى الصرافين المرخصين وعدّ المال أمامهم.","احترم المعابد والطقوس في بالي، ولا تتسلق الأماكن المقدسة."],
 ["Pay the Bali levy only at love.bali.gov.id; fake links and double charges have spread.","Avoid cheap cocktails or arak of unknown origin; methanol poisoning has killed tourists.","Use licensed money changers and count the cash in front of them.","Respect temples and ceremonies in Bali, and never climb sacred sites."],
 ["Payez la taxe de Bali uniquement sur love.bali.gov.id ; faux liens et doubles prélèvements circulent.","Évitez les cocktails bon marché ou l'arak d'origine inconnue ; l'intoxication au méthanol a tué des touristes.","Changez chez des changeurs agréés et comptez l'argent devant eux.","Respectez les temples et cérémonies à Bali, et ne grimpez jamais sur les sites sacrés."],
 ["Bali-Abgabe nur über love.bali.gov.id zahlen; gefälschte Links und Doppelbelastungen sind verbreitet.","Billige Cocktails oder Arak unbekannter Herkunft meiden; Methanolvergiftungen haben Touristen getötet.","Nur lizenzierte Geldwechsler nutzen und das Geld vor Ort nachzählen.","Tempel und Zeremonien auf Bali respektieren; heilige Stätten nie besteigen."]),
ca:W(["اطلب eTA من canada.ca فقط بـ7 دولارات كندية؛ المواقع الأخرى تأخذ أضعافها.","مكالمات من «الضرائب» أو «الهجرة» تطلب الدفع ببطاقات هدايا أو عملات رقمية احتيال دائماً.","الشتاء قاسٍ جداً؛ إطارات الشتاء إلزامية في كيبيك من 1 ديسمبر إلى 15 مارس."],
 ["Apply for the eTA only on canada.ca for CAD 7; other sites charge several times more.","Calls from 'tax' or 'immigration' officials demanding payment in gift cards or crypto are always scams.","Winters are harsh; winter tyres are mandatory in Quebec from 1 Dec to 15 Mar."],
 ["Demandez l'AVE uniquement sur canada.ca pour 7 $ CA ; les autres sites facturent plusieurs fois plus.","Les appels de « l'impôt » ou de « l'immigration » exigeant un paiement en cartes cadeaux ou cryptomonnaie sont toujours des arnaques.","Les hivers sont rudes ; pneus d'hiver obligatoires au Québec du 1er déc. au 15 mars."],

const HELP={
ar:{title:"ماذا أفعل إذا…؟",emb:"ابحث عن سفارة بلدك هنا",embNote:"يفتح بحثاً عن سفارة جنسيتك في هذا البلد مع العنوان والرقم. احفظ رقمها قبل أن تحتاجه.",s:[
 ["فقدت جوازي أو سُرق",["بلّغ الشرطة ({n}) واطلب محضراً مكتوباً، فستحتاجه للسفارة والتأمين.","تواصل مع سفارة بلدك لإصدار جواز جديد أو وثيقة سفر طارئة، وخذ معك صوراً شخصية ونسخة من الجواز ومحضر الشرطة.","إذا كانت فيزتك أو إقامتك في الجواز المفقود، راجع جهة الهجرة ({r}) لنقلها أو للحصول على إذن مغادرة.","نصيحة مسبقة: احفظ صورة من جوازك وفيزتك في هاتفك وبريدك."]],
 ["اقتربت مدة إقامتي من الانتهاء",["لا تتجاوز المدة ولو يوماً واحداً؛ العقوبة قد تكون غرامة ومنع دخول وتسجيلاً في سجلك.","اسأل جهة الهجرة ({r}) عن التمديد قبل انتهاء المدة. في دول شنغن التمديد للحالات الاستثنائية فقط مثل المرض أو إلغاء الرحلات.","إذا لم يكن التمديد ممكناً، احجز المغادرة قبل آخر يوم واحتفظ بإثبات الخروج مثل بطاقة الصعود.","إذا علقت بسبب مرض أو إلغاء رحلة، راجع الهجرة قبل انتهاء المدة ومعك ما يثبت ذلك."]],
 ["أوقفتني الشرطة أو احتُجزت",["حافظ على هدوئك وأدبك، ولا تقاوم، ولا تعرض أي مال، فالرشوة جريمة.","أظهر جوازك أو هويتك عند الطلب.","من حقك طلب التواصل مع سفارة بلدك، ومن حقك طلب مترجم ومحامٍ.","لا توقّع على أي ورقة بلغة لا تفهمها."]],
 ["تعرضت لحادث سيارة",["أوقف السيارة وشغّل إشارات التحذير وضع المثلث، واتصل بالطوارئ ({n}) إذا وُجد مصابون.","اتصل بالشرطة. في بعض الدول تُسجَّل الحوادث البسيطة عبر تطبيق رسمي.","صوّر المكان والسيارات، وتبادل الاسم ورقم اللوحة وبيانات التأمين مع الطرف الآخر.","أبلغ شركة التأجير أو التأمين فوراً، ولا تعترف بالخطأ كتابياً قبل أن تفهم ما توقّع عليه."]]]},
en:{title:"What do I do if…?",emb:"Find your embassy here",embNote:"Searches for your nationality's embassy in this country, with address and phone. Save its number before you need it.",s:[
 ["My passport is lost or stolen",["Report it to the police ({n}) and ask for a written report; the embassy and insurer will need it.","Contact your embassy for a new passport or emergency travel document; bring photos, a passport copy and the police report.","If your visa or residence was in the lost passport, go to the immigration authority ({r}) to transfer it or get an exit permit.","Tip: keep photos of your passport and visa on your phone and in your email."]],
 ["My allowed stay is ending",["Don't overstay even one day; penalties can include fines, entry bans and a record.","Ask the immigration authority ({r}) about an extension before it expires. In Schengen, extensions are only for exceptional cases like illness or cancelled flights.","If you can't extend, book your departure before the last day and keep proof of exit such as your boarding pass.","If you're stuck by illness or a cancelled flight, contact immigration before expiry with proof."]],
 ["I'm stopped or detained by police",["Stay calm and polite, don't resist, and never offer money; bribery is a crime.","Show your passport or ID when asked.","You have the right to contact your embassy and to ask for an interpreter and a lawyer.","Don't sign anything in a language you don't understand."]],
 ["I've had a car accident",["Stop, switch on hazard lights, place the warning triangle, and call emergency ({n}) if anyone is hurt.","Call the police. In some countries minor accidents are reported through an official app.","Photograph the scene and vehicles, and exchange names, plate numbers and insurance details.","Tell the rental company or insurer at once, and don't admit fault in writing before you understand what you sign."]]]},
fr:{title:"Que faire si… ?",emb:"Trouver votre ambassade ici",embNote:"Recherche l'ambassade de votre nationalité dans ce pays, avec adresse et téléphone. Enregistrez son numéro à l'avance.",s:[
 ["J'ai perdu mon passeport ou on me l'a volé",["Déclarez-le à la police ({n}) et demandez un récépissé écrit ; l'ambassade et l'assureur en auront besoin.","Contactez votre ambassade pour un nouveau passeport ou un document de voyage d'urgence ; apportez photos, copie du passeport et récépissé.","Si votre visa ou titre de séjour était dans ce passeport, adressez-vous au service d'immigration ({r}) pour le transférer ou obtenir une autorisation de sortie.","Conseil : gardez des photos de votre passeport et visa sur votre téléphone et dans vos e-mails."]],
 ["Mon séjour autorisé se termine",["Ne dépassez pas, même d'un jour ; amendes, interdiction d'entrée et inscription au dossier sont possibles.","Demandez une prolongation au service d'immigration ({r}) avant l'échéance. Dans Schengen, seulement en cas exceptionnel (maladie, vols annulés).","Sans prolongation, réservez votre départ avant le dernier jour et gardez une preuve de sortie (carte d'embarquement).","Si vous êtes bloqué (maladie, vol annulé), contactez l'immigration avant l'échéance avec des justificatifs."]],
 ["La police m'arrête ou me retient",["Restez calme et poli, ne résistez pas et n'offrez jamais d'argent ; la corruption est un délit.","Présentez votre passeport ou pièce d'identité sur demande.","Vous avez le droit de contacter votre ambassade et de demander un interprète et un avocat.","Ne signez rien dans une langue que vous ne comprenez pas."]],
 ["J'ai eu un accident de voiture",["Arrêtez-vous, allumez les feux de détresse, posez le triangle et appelez les urgences ({n}) en cas de blessés.","Appelez la police. Dans certains pays, les accidents légers se déclarent via une appli officielle.","Photographiez les lieux et les véhicules, échangez noms, immatriculations et assurances.","Prévenez tout de suite le loueur ou l'assureur, et ne reconnaissez pas de faute par écrit sans comprendre ce que vous signez."]]]},

function stayCalc(){
 if(!STAY.s) return {msg:"stayEmpty"};
 const c=C.find(x=>x.id===STAY.c)||C[0], r=status(c.id), today=todayD(), s=toD(STAY.s);
 if(s>today) return {msg:"stayFuture"};
 if(["home","free"].includes(r[0])&&!STAY.x) return {msg:"stayFree"};
 const allowed=["home","free"].includes(r[0])?null:(DAYS.get(r[1])||null), sch=destKey(c.id)==="sch"&&allowed===90;
 let last=null, used=Math.round((today-s)/DAY)+1;
 if(sch){
  const w0=today-179*DAY; let u=Math.round((today-Math.max(s,w0))/DAY)+1;
  TRIPS.forEach(tr=>{if(destKey(tr.c)!=="sch")return;const a=Math.max(toD(tr.s),w0),b=Math.min(toD(tr.e),s-DAY,today);if(b>=a)u+=Math.round((b-a)/DAY)+1});
  used=u; last=today+(90-u)*DAY;
 } else if(allowed) last=s+(allowed-1)*DAY;
 if(STAY.x){const x=toD(STAY.x); if(last==null||x<last) last=x}
 if(last==null) return {msg:"stayNeedX"};
 return {c,last,used,rem:Math.round((last-today)/DAY),sch};
}

  return `<article class="item st-${dateCls(t)}"><div class="hd"><h3>${T.types[d.t]}${d.n?" · "+esc(d.n):""}</h3><span class="days">${Math.abs(n)}</span></div>
   <div class="meta">${n<0?T.expired+" "+nd(n,1):lang==="ar"?T.left+" "+nd(n):nd(n)+" "+T.left} · ${fmt(t)}</div>
   <div class="row-btns"><button type="button" class="ghost" data-ics="${d.id}" title="${T.calNote}">${T.cal}</button><button type="button" class="ghost del" data-deldate="${d.id}">${T.del}</button></div></article>`}).join("");
}
function alertsView(){
 const T=T2[lang], out=[], now=todayD();
 DATES.forEach(d=>{const t=toD(d.d),n=Math.round((t-now)/DAY),nm=T.types[d.t]+(d.n?" ("+esc(d.n)+")":""); if(n<=60) out.push([n<30?"no":"cau", n<0?`${T.docExp} ${nm}`:`${nm} ${T.docSoon} ${rel(t)}`])});
 TRIPS.forEach(tr=>{const c=C.find(x=>x.id===tr.c); if(!c) return; const s=toD(tr.s),n=(s-now)/DAY,items=checklist(tr),done=items.filter(i=>tr.done&&tr.done[i[0]]).length;
  if(n>=0&&n<=14&&done<items.length) out.push(["cau",`${T.soon} ${esc(L(c.n))} ${rel(s)} ${T.soonTail} (${done}/${items.length})`])});
 {const k=stayCalc(); if(k.last!=null&&k.rem<=7) out.push([k.rem<0?"no":"cau",k.rem<0?`${T.stayAlert}: ${esc(L(k.c.n))} · ${T.stayOver} ${nd(k.rem,1)}!`:`${T.stayAlert}: ${esc(L(k.c.n))} · ${T.stayLast} ${fmt(k.last)} (${rel(k.last)})`])}
 $("alerts").innerHTML=out.map(a=>`<div class="alert st-${a[0]}">${a[1]}</div>`).join("");
}
function ics(d){
 const T=T2[lang], t=toD(d.d)-30*DAY, f=x=>new Date(x).toISOString().slice(0,10).replace(/-/g,"");
 const title=`${T.types[d.t]}${d.n?" ("+d.n+")":""} ${T.docSoon} ${fmt(toD(d.d))}`;
 if(window.claude){const g="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(title)+"&dates="+f(t)+"/"+f(t+DAY);const a=document.createElement("a");a.href=g;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();return}
 const body=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Border Companion//EN","BEGIN:VEVENT",`UID:${d.id}@bordercompanion`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z`,`DTSTART;VALUE=DATE:${f(t)}`,`DTEND;VALUE=DATE:${f(t+DAY)}`,`SUMMARY:${title}`,"BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${title}`,"TRIGGER:PT9H","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
 const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([body],{type:"text/calendar"})); a.download="border-companion-reminder.ics"; document.body.appendChild(a); a.click(); a.remove();
}
function setView(v){VIEW=v;store("ub_view",v);["countries","trips","dates"].forEach(x=>{$("v-"+x).hidden=x!==v;$("t_"+x).setAttribute("aria-selected",x===v)})}
const refresh=()=>{stayView();tripsView();datesView();alertsView()};
const opts=(arr,v)=>arr.map(x=>`<option value="${x[0]}"${x[0]===v?" selected":""}>${esc(L(x[1]))}</option>`).join("");

/* ---------- Render ---------- */
function render(){
 const t=UI[lang], T=T2[lang];
 document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 $("langSel").value=lang; $("appName").textContent=t.name; $("tagline").textContent=t.tag;
 $("disclaimer").textContent=t.disc; $("privacy").textContent=L(PRIV);
 {const B=BK[lang]; $("bk_t").textContent=B.t; $("bk_i").textContent=B.i; $("bk_ex").textContent=B.ex; $("bk_im").textContent=B.im; $("bk_msg").textContent="";}
 $("natL").textContent=t.nat; $("purL").textContent=t.purpose; $("holdL").textContent=t.holds;
 $("h_visaL").textContent=t.hVisa; $("h_wresL").textContent=t.hWres; $("h_gccL").textContent=t.hGcc;
 $("nat").innerHTML=opts(NAT,nat); $("purpose").innerHTML=opts(PUR,pur);
 $("h_visa").checked=H.visa; $("h_wres").checked=H.wres; $("h_gcc").checked=H.gcc;

 ["countries","trips","dates"].forEach(x=>$("t_"+x).querySelector("span").textContent=T[x]);
 $("tr_cL").textContent=T.dest; $("tr_driveL").textContent=T.drive; $("tr_sL").textContent=T.from; $("tr_eL").textContent=T.to; $("tr_add").textContent=T.addTrip;
 const cv=$("tr_c").value; $("tr_c").innerHTML=C.map(c=>[c.id,c.n]).map(x=>`<option value="${x[0]}">${esc(L(x[1]))}</option>`).join(""); if(cv) $("tr_c").value=cv;
 $("st_t").textContent=T.stayT; $("st_i").textContent=T.stayI; $("st_cL").textContent=T.stayC; $("st_sL").textContent=T.stayS; $("st_xL").textContent=T.stayX;
 $("st_c").innerHTML=C.map(c=>`<option value="${c.id}">${esc(L(c.n))}</option>`).join(""); $("st_c").value=STAY.c||sel; $("st_s").value=STAY.s; $("st_x").value=STAY.x;
 $("d_tL").textContent=T.type; $("d_nL").textContent=T.label; $("d_n").placeholder=T.ph; $("d_dL").textContent=T.exp; $("d_add").textContent=T.addDate;
 const tv=$("d_t").value; $("d_t").innerHTML=Object.entries(T.types).map(([k,v])=>`<option value="${k}">${v}</option>`).join(""); if(tv) $("d_t").value=tv;
 stamps(); guide(); refresh(); setView(VIEW);
}
const EDIT=q("تعديل","Edit","Modifier","Ändern");
const profChanged=()=>{saveProf();stamps();guide();refresh()};
$("langSel").onchange=e=>{lang=e.target.value;store("ub_lang",lang);render()};
$("countrySel").onchange=e=>{sel=e.target.value;store("ub_sel",sel);guide()};
$("nat").onchange=e=>{nat=e.target.value;profChanged()};
$("purpose").onchange=e=>{pur=e.target.value;profChanged()};
[["h_visa","visa"],["h_wres","wres"],["h_gcc","gcc"]].forEach(([id,k])=>$(id).onchange=e=>{H[k]=e.target.checked;profChanged()});
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("[data-v]");if(b){setView(b.dataset.v);try{window.scrollTo(0,0)}catch(_){}}};
$("tripForm").onsubmit=e=>{e.preventDefault();const s=$("tr_s").value,en=$("tr_e").value;if(!s||!en)return;
 TRIPS.push({id:uid(),c:$("tr_c").value,s,e:en<s?s:en,drive:$("tr_drive").checked,done:{}});saveT();e.target.reset();refresh()};
$("dateForm").onsubmit=e=>{e.preventDefault();const d=$("d_d").value;if(!d)return;
 DATES.push({id:uid(),t:$("d_t").value,n:$("d_n").value.trim(),d});saveT();e.target.reset();refresh()};
$("tripList").onchange=e=>{const i=e.target;if(!i.dataset.trip)return;const tr=TRIPS.find(x=>x.id===i.dataset.trip);tr.done=tr.done||{};tr.done[i.dataset.k]=i.checked;saveT();refresh()};
$("tripList").onclick=e=>{const b=e.target.closest("[data-deltrip]");if(b){TRIPS=TRIPS.filter(x=>x.id!==b.dataset.deltrip);saveT();refresh()}};
$("dateList").onclick=e=>{const b=e.target.closest("[data-deldate]");if(b){DATES=DATES.filter(x=>x.id!==b.dataset.deldate);saveT();refresh();return}
 const c=e.target.closest("[data-ics]");if(c) ics(DATES.find(x=>x.id===c.dataset.ics))};
$("bk_ex").onclick=doExport;
$("bk_file").onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)doImport(f);e.target.value=""};
const stayChg=()=>{STAY={c:$("st_c").value,s:$("st_s").value,x:$("st_x").value};store("ub_stay",STAY);stayView();alertsView()};
["st_c","st_s","st_x"].forEach(id=>$(id).onchange=stayChg);
$("stayOut").onclick=e=>{if(e.target.id==="st_clear"){STAY={c:$("st_c").value,s:"",x:""};$("st_s").value="";$("st_x").value="";store("ub_stay",STAY);stayView();alertsView()}};
/* ---------- Privacy, backup, offline ---------- */
const PRIV=q("خصوصيتك: كل ما تُدخله (جنسيتك ورحلاتك ومواعيدك) يُحفظ في جوالك فقط، ولا يُرسل إلى أي خادم. الأزرار التي تفتح مواقع خارجية لا تنقل بياناتك.",
 "Your privacy: everything you enter (nationality, trips, dates) is stored only on your phone and never sent to any server. Buttons that open outside sites don't pass on your data.",
 "Confidentialité : tout ce que vous saisissez (nationalité, voyages, échéances) reste uniquement sur votre téléphone et n'est envoyé à aucun serveur. Les boutons vers des sites externes ne transmettent pas vos données.",
 "Datenschutz: Alles, was Sie eingeben (Nationalität, Reisen, Fristen), bleibt nur auf Ihrem Handy und wird an keinen Server gesendet. Buttons zu externen Seiten geben Ihre Daten nicht weiter.");
const BK={ar:{t:"نسخة احتياطية",i:"احفظ رحلاتك ومواعيدك في ملف، لتستعيدها إذا غيّرت جوالك أو مسحت بيانات المتصفح.",ex:"حفظ نسخة احتياطية",im:"استعادة من ملف",ok:"تمت الاستعادة بنجاح.",bad:"الملف غير صالح.",saved:"تم حفظ الملف.",no:"تعذّر حفظ الملف هنا."},
 en:{t:"Backup",i:"Save your trips and dates to a file so you can restore them on a new phone or after clearing browser data.",ex:"Save a backup",im:"Restore from file",ok:"Restored successfully.",bad:"This file isn't valid.",saved:"File saved.",no:"Couldn't save the file here."},
 fr:{t:"Sauvegarde",i:"Enregistrez vos voyages et échéances dans un fichier pour les restaurer sur un nouveau téléphone ou après avoir effacé les données du navigateur.",ex:"Enregistrer une sauvegarde",im:"Restaurer depuis un fichier",ok:"Restauration réussie.",bad:"Ce fichier n'est pas valide.",saved:"Fichier enregistré.",no:"Impossible d'enregistrer le fichier ici."},
 de:{t:"Sicherung",i:"Reisen und Fristen in einer Datei sichern, um sie auf einem neuen Handy oder nach dem Löschen der Browserdaten wiederherzustellen.",ex:"Sicherung speichern",im:"Aus Datei wiederherstellen",ok:"Erfolgreich wiederhergestellt.",bad:"Diese Datei ist ungültig.",saved:"Datei gespeichert.",no:"Datei konnte hier nicht gespeichert werden."}};
const bkMsg=(m,bad)=>{const el=$("bk_msg");el.textContent=m;el.style.color=bad?"var(--no)":"var(--ok)"};
async function doExport(){
 const B=BK[lang], data=JSON.stringify({app:"border-companion",v:1,saved:new Date().toISOString(),nat,pur,H,lang,TRIPS,DATES,STAY},null,1), name="border-companion-backup-"+new Date().toISOString().slice(0,10)+".json";
 try{
  if(window.claude&&window.claude.use){const d=await window.claude.use("downloads"); if(d){await d.save({filename:name,data}); bkMsg(B.saved); return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();bkMsg(B.saved);
 }catch(e){ if(!(e&&e.code==="declined")) bkMsg(B.no,true) }
}
function doImport(file){
 const B=BK[lang], fr=new FileReader();
 fr.onload=()=>{try{const o=JSON.parse(fr.result); if(!o||o.app!=="border-companion"||!Array.isArray(o.TRIPS)||!Array.isArray(o.DATES)) throw 0;
  TRIPS=o.TRIPS.filter(t=>t&&C.find(c=>c.id===t.c)&&/^\d{4}-\d\d-\d\d$/.test(t.s)&&/^\d{4}-\d\d-\d\d$/.test(t.e));
  DATES=o.DATES.filter(d=>d&&T2.en.types[d.t]&&/^\d{4}-\d\d-\d\d$/.test(d.d)).map(d=>({id:String(d.id||uid()),t:d.t,n:String(d.n||"").slice(0,40),d:d.d}));
  if(NAT.find(x=>x[0]===o.nat)) nat=o.nat; if(PUR.find(x=>x[0]===o.pur)) pur=o.pur; if(o.H) H={visa:!!o.H.visa,wres:!!o.H.wres,gcc:!!o.H.gcc};
  if(o.STAY&&typeof o.STAY==="object") STAY={c:String(o.STAY.c||""),s:String(o.STAY.s||""),x:String(o.STAY.x||"")};
  saveT();saveProf();store("ub_stay",STAY);render();bkMsg(BK[lang].ok)}catch(e){bkMsg(B.bad,true)}};
 fr.readAsText(file);
}
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !window.claude){
 window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
}
render();
</script>
