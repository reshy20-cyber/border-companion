<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="رفيق الحدود">
<title>رفيق الحدود Border Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Border Companion: travel and residence law guide">
<meta name="theme-color" content="#0F2F52">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=El+Messiri:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone app — passport-navy header band, traveller card, content cards, fixed bottom navigation */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --ink:#0E1B2B; --muted:#475667; --line:#D5DDE7;
  --navy:#0F2F52; --navy2:#1A4573; --on-navy:#F4EEDD; --gold:#E4B649; --gold-ink:#8A6110; --tint:#E3EBF5;
  --ok:#1E7A45; --mid:#1F5FAE; --cau:#9C5F00; --no:#B3372B; --warn-bg:#FBEDE9;
  --display:"El Messiri","Readex Pro",system-ui,sans-serif;
  --body:"Readex Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08121F; --surface:#111F33; --ink:#E9EFF6; --muted:#A8B7C8; --line:#22344C;
  --navy:#0B1F38; --navy2:#16365C; --on-navy:#F4EEDD; --gold:#E9BF5A; --gold-ink:#E9BF5A; --tint:#172B45;
  --ok:#5FD08A; --mid:#7DB4F0; --cau:#E8B44A; --no:#F28474; --warn-bg:#33201C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08121F; --surface:#111F33; --ink:#E9EFF6; --muted:#A8B7C8; --line:#22344C;
  --navy:#0B1F38; --navy2:#16365C; --on-navy:#F4EEDD; --gold:#E9BF5A; --gold-ink:#E9BF5A; --tint:#172B45;
  --ok:#5FD08A; --mid:#7DB4F0; --cau:#E8B44A; --no:#F28474; --warn-bg:#33201C; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;font-weight:400;-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto}

/* header */
.top{background:linear-gradient(160deg,var(--navy2),var(--navy));color:var(--on-navy);border-bottom:3px solid var(--gold)}
.top .wrap{padding-block:12px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.top .lang{align-self:flex-end;order:-1;font-size:14px;padding:6px 14px}
.logo{width:52px;height:52px;border-radius:14px;flex:none;box-shadow:0 2px 10px rgb(0 0 0 / .25)}
.brand{min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.brand h1{font-family:var(--display);font-size:40px;margin:0;line-height:1.15;font-weight:700;letter-spacing:.01em;text-shadow:0 2px 10px rgb(0 0 0 / .25)}
.brand h1::after{content:"";display:block;width:56px;height:3px;border-radius:2px;background:var(--gold);margin:10px auto 0}
.brand p{margin:0;font-size:18px;font-weight:500;opacity:.92;line-height:1.5;max-width:22em;text-wrap:balance}
.lang{appearance:none;-webkit-appearance:none;background:rgb(255 255 255 / .12);color:var(--on-navy);border:1px solid rgb(255 255 255 / .28);border-radius:999px;padding:8px 14px;font:inherit;font-size:15px;font-weight:600;width:auto;min-height:0}
.lang option{color:#0E1B2B;background:#fff}

main.wrap{display:flex;flex-direction:column;gap:16px;padding-block:18px 24px}

/* traveller card */
.profile{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.psum{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:14px 16px;text-align:start}
.psum .badge{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--navy2);display:grid;place-items:center;flex:none}
:root[data-theme="dark"] .psum .badge{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .psum .badge{color:var(--gold)}}
.psum .txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.psum .lbl{font-size:14px;color:var(--muted);font-weight:500}
.psum .val{font-size:18px;font-weight:600}
.psum .sub{font-size:14.5px;color:var(--muted)}
.psum .edit{font-size:15px;font-weight:600;color:var(--gold-ink);display:flex;align-items:center;gap:6px}
.pbody{border-top:1px solid var(--line);padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.prow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.prow{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.holds legend{font-size:15px;color:var(--muted);font-weight:500}
select,input[type=date],input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:50px}
.holds{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.holds label{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.holds input,.chk input,.todo input{accent-color:var(--navy2);width:20px;height:20px;flex:none;margin-top:4px}

/* pickers */
.holdsbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.holdsbox summary{cursor:pointer;font-weight:600;color:var(--navy2)}
.holdsbox[open] summary{margin-bottom:10px}
:root[data-theme="dark"] .holdsbox summary{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .holdsbox summary{color:var(--gold)}}
.picker{display:flex;flex-direction:column;gap:6px}
.picker label{font-size:15px;color:var(--muted);font-weight:500}
.selwrap{position:relative;display:flex;align-items:center}
.selwrap svg{position:absolute;inset-inline-start:14px;color:var(--navy2);pointer-events:none}
html,body{max-width:100%;overflow-x:hidden}
.picker,.selwrap{min-width:0;max-width:100%}
select.big{flex:1 1 0;min-width:0;max-width:100%;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;font-size:19px;font-weight:600;background:var(--surface);border:2px solid var(--navy2);min-height:58px;padding-inline-start:46px;border-radius:14px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) select.big{border-color:var(--gold)}:root:not([data-theme="light"]) .selwrap svg{color:var(--gold)}}
:root[data-theme="dark"] select.big{border-color:var(--gold)}:root[data-theme="dark"] .selwrap svg{color:var(--gold)}

/* country hero */
.hero{background:linear-gradient(150deg,var(--navy2),var(--navy));color:var(--on-navy);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero .flag{font-size:64px;line-height:1;flex:none;filter:drop-shadow(0 3px 8px rgb(0 0 0 / .45))}
.hero h2{font-size:34px;color:#fff;text-shadow:0 1px 3px rgb(0 0 0 / .9),0 2px 14px rgb(0 0 0 / .7)}
.hero .chip{background:rgb(8 18 31 / .7);border-color:rgb(255 255 255 / .35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.hero .checked{opacity:1;align-self:center;background:rgb(8 18 31 / .7);border-radius:8px;padding:1px 10px}
.hero .row{display:flex;align-items:center;justify-content:center;gap:14px;text-align:center}
.hero{align-items:center;text-align:center}
.hero .code{font-family:var(--mono);font-weight:600;font-size:22px;letter-spacing:.14em;border:2px solid var(--gold);color:var(--gold);border-radius:10px;padding:4px 10px}
.hero h2{font-family:var(--display);font-size:30px;margin:0;line-height:1.2;text-wrap:balance}
.hero .facts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.hero .chip{font-size:18px;font-weight:600;background:rgb(255 255 255 / .1);border:1px solid rgb(255 255 255 / .22);border-radius:999px;padding:4px 12px}
.hero .chip b{font-family:var(--mono);font-weight:600}
.hero .checked{font-size:13.5px;opacity:.75}

/* status card */
.st-ok{--s:var(--ok)} .st-mid{--s:var(--mid)} .st-cau{--s:var(--cau)} .st-no{--s:var(--no)}
.mine{background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--s);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.mine h3{margin:0;font-size:15.5px;color:var(--muted);font-weight:500}
.stamp{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;color:var(--s);border:2.5px solid var(--s);border-radius:8px;padding:3px 12px;font-weight:700;font-size:17px}
.conf{font-size:15px;color:var(--muted)}
.apply{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--navy2);color:#fff;text-decoration:none;border-radius:12px;padding:13px 14px;font-weight:600;font-size:17px;margin-top:4px}
.apply svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:root[data-theme="dark"] .apply{background:var(--gold);color:#08121F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .apply{background:var(--gold);color:#08121F}}
.applynote{font-size:14px;color:var(--muted);text-align:center}
.conf.ck{color:var(--cau);font-weight:500}

/* section cards */
section.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card .h{display:flex;align-items:center;gap:10px}
.card .ic{width:38px;height:38px;border-radius:11px;background:var(--tint);color:var(--navy2);display:grid;place-items:center;flex:none}
:root[data-theme="dark"] .card .ic{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card .ic{color:var(--gold)}}
.card h3{margin:0;font-size:19px;font-weight:600}
.card.warn{background:var(--warn-bg);border-color:transparent}
.card.warn .ic{background:var(--no);color:#fff}
.card ul{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.card li::marker{color:var(--gold-ink)}
.src{font-size:15px;color:var(--muted)}
.src a{color:var(--navy2);font-weight:600;word-break:break-word}
:root[data-theme="dark"] .src a{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .src a{color:var(--gold)}}
.sos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sos div{border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;background:var(--bg)}
.sos span{font-size:14.5px;color:var(--muted)}
.sos b{font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--no)}
.disclaimer{font-size:15px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin:0}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alerts:empty{display:none}
.alert{border-inline-start:5px solid var(--s);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:16px;font-weight:500}

/* trips & dates */
.view{display:flex;flex-direction:column;gap:16px}
.form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.chk{display:flex;gap:10px;align-items:center;font-size:16px;color:var(--ink)!important;height:100%;padding-top:22px}
@media (max-width:460px){.chk{padding-top:0}}
.primary{background:var(--navy2);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:600;font-size:17px}
.list{display:flex;flex-direction:column;gap:14px}
.item{background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--s);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.item .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.item h3{margin:0;font-family:var(--display);font-size:22px}
.pill{background:var(--s);color:#fff;font-weight:600;font-size:15px;border-radius:999px;padding:3px 12px}
:root[data-theme="dark"] .pill{color:#08121F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill{color:#08121F}}
.meta{font-size:15px;color:var(--muted)}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.todo label{display:flex;gap:10px;align-items:flex-start}
.todo input:checked+span{color:var(--muted);text-decoration:line-through}
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:15px;font-weight:500}
.ghost.del{color:var(--no)}
.days{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--s);font-variant-numeric:tabular-nums}
.note{font-size:15px;padding:9px 12px;border-radius:10px;background:var(--warn-bg)}
#st_i{margin:-6px 0 0}
.sth{margin:0;font-family:var(--display);font-size:22px}
.stayres{border-inline-start:6px solid var(--s);background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.stayres .sh{font-size:19px;font-weight:700;color:var(--s)}
.stayres .ghost{margin-top:6px}
.whatif{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg)}
.whatif summary{cursor:pointer;font-weight:600;font-size:17px}
.whatif[open] summary{margin-bottom:6px}
.whatif ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.disclaimer.privacy{border-top:0;padding-top:0;margin-top:-6px}
.bkim{display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:600;flex:1;text-align:center}
.emptyv{color:var(--muted);text-align:center;padding:26px 14px;border:2px dashed var(--line);border-radius:16px}

/* bottom navigation */
nav.tabs{position:fixed;inset:auto 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgb(14 27 43 / .08);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;font-size:14.5px;font-weight:600;color:var(--muted);position:relative}
nav.tabs button svg.i{width:26px;height:26px}
nav.tabs button[aria-selected="true"]{color:var(--navy2)}
:root[data-theme="dark"] nav.tabs button[aria-selected="true"]{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{color:var(--gold)}}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;width:36px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<header class="top"><div class="wrap pad">
  <div class="brand"><h1 id="appName">رفيق الحدود</h1><p id="tagline"></p></div>
  <select class="lang" id="langSel" aria-label="Language"><option value="ar">العربية</option><option value="en">English</option><option value="fr">Français</option><option value="de">Deutsch</option></select>
</div></header>

<main class="wrap pad">
  <div id="alerts" class="alerts"></div>

  <div id="v-countries" class="view">
    <div class="picker"><label for="nat" id="natL"></label>
      <div class="selwrap"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M9 16h6"/></svg><select id="nat" class="big"></select></div>
    </div>
    <div class="picker"><label for="purpose" id="purL"></label>
      <div class="selwrap"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg><select id="purpose" class="big"></select></div>
    </div>
    <div class="picker"><label for="countrySel" id="countryL"></label>
      <div class="selwrap"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><select id="countrySel" class="big"></select></div>
    </div>
    <details class="holdsbox"><summary id="holdL"></summary>
      <div class="holds">
        <label><input type="checkbox" id="h_visa"><span id="h_visaL"></span></label>
        <label><input type="checkbox" id="h_wres"><span id="h_wresL"></span></label>
        <label><input type="checkbox" id="h_gcc"><span id="h_gccL"></span></label>
      </div>
    </details>
    <div id="guide" class="view"></div>
  </div>

  <div id="v-trips" class="view" hidden>
    <section class="form" id="stayCard"><h2 class="sth" id="st_t"></h2><p class="meta" id="st_i"></p>
      <div class="prow">
        <div class="field"><label for="st_c" id="st_cL"></label><select id="st_c"></select></div>
        <div class="field"><label for="st_s" id="st_sL"></label><input type="date" id="st_s"></div>
        <div class="field"><label for="st_x" id="st_xL"></label><input type="date" id="st_x"></div>
      </div>
      <div id="stayOut"></div>
    </section>
    <form class="form" id="tripForm">
      <div class="prow">
        <div class="field"><label for="tr_c" id="tr_cL"></label><select id="tr_c"></select></div>
        <div class="field"><label class="chk"><input type="checkbox" id="tr_drive"><span id="tr_driveL"></span></label></div>
        <div class="field"><label for="tr_s" id="tr_sL"></label><input type="date" id="tr_s" required></div>
        <div class="field"><label for="tr_e" id="tr_eL"></label><input type="date" id="tr_e" required></div>
      </div>
      <button type="submit" class="primary" id="tr_add"></button>
    </form>
    <div id="tripList" class="list"></div>
  </div>

  <div id="v-dates" class="view" hidden>
    <form class="form" id="dateForm">
      <div class="prow">
        <div class="field"><label for="d_t" id="d_tL"></label><select id="d_t"></select></div>
        <div class="field"><label for="d_n" id="d_nL"></label><input type="text" id="d_n" maxlength="40"></div>
        <div class="field"><label for="d_d" id="d_dL"></label><input type="date" id="d_d" required></div>
      </div>
      <button type="submit" class="primary" id="d_add"></button>
    </form>
    <div id="dateList" class="list"></div>
    <section class="form" id="bkCard"><h2 class="sth" id="bk_t"></h2><p class="meta" id="bk_i" style="margin:-6px 0 0"></p>
      <div class="row-btns"><button type="button" class="primary" id="bk_ex" style="flex:1"></button>
      <label class="ghost bkim" for="bk_file"><span id="bk_im"></span></label><input type="file" id="bk_file" accept=".json,application/json" hidden></div>
      <div class="meta" id="bk_msg" role="status"></div>
    </section>
  </div>

  <p class="disclaimer" id="disclaimer"></p>
  <p class="disclaimer privacy" id="privacy"></p>
</main>

<nav class="tabs" role="tablist"><div class="in">
  <button type="button" role="tab" data-v="countries" id="t_countries"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span></span></button>
  <button type="button" role="tab" data-v="trips" id="t_trips"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg><span></span></button>
  <button type="button" role="tab" data-v="dates" id="t_dates"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span></span></button>
</div></nav>
<script src="data.js"></script>

 ["اقتربت مدة إقامتي من الانتهاء",["لا تتجاوز المدة ولو يوماً واحداً؛ العقوبة قد تكون غرامة ومنع دخول وتسجيلاً في سجلك.","اسأل جهة الهجرة ({r}) عن التمديد قبل انتهاء المدة. في دول شنغن التمديد للحالات الاستثنائية فقط مثل المرض أو إلغاء الرحلات.","إذا لم يكن التمديد ممكناً، احجز المغادرة قبل آخر يوم واحتفظ بإثبات الخروج مثل بطاقة الصعود.","إذا علقت بسبب مرض أو إلغاء رحلة، راجع الهجرة قبل انتهاء المدة ومعك ما يثبت ذلك."]],
 ["أوقفتني الشرطة أو احتُجزت",["حافظ على هدوئك وأدبك، ولا تقاوم، ولا تعرض أي مال، فالرشوة جريمة.","أظهر جوازك أو هويتك عند الطلب.","من حقك طلب التواصل مع سفارة بلدك، ومن حقك طلب مترجم ومحامٍ.","لا توقّع على أي ورقة بلغة لا تفهمها."]],
 ["تعرضت لحادث سيارة",["أوقف السيارة وشغّل إشارات التحذير وضع المثلث، واتصل بالطوارئ ({n}) إذا وُجد مصابون.","اتصل بالشرطة. في بعض الدول تُسجَّل الحوادث البسيطة عبر تطبيق رسمي.","صوّر المكان والسيارات، وتبادل الاسم ورقم اللوحة وبيانات التأمين مع الطرف الآخر.","أبلغ شركة التأجير أو التأمين فوراً، ولا تعترف بالخطأ كتابياً قبل أن تفهم ما توقّع عليه."]]]},
en:{title:"What do I do if…?",emb:"Find your embassy here",embNote:"Searches for your nationality's embassy in this country, with address and phone. Save its number before you need it.",s:[
 ["My passport is lost or stolen",["Report it to the police ({n}) and ask for a written report; the embassy and insurer will need it.","Contact your embassy for a new passport or emergency travel document; bring photos, a passport copy and the police report.","If your visa or residence was in the lost passport, go to the immigration authority ({r}) to transfer it or get an exit permit.","Tip: keep photos of your passport and visa on your phone and in your email."]],
 ["My allowed stay is ending",["Don't overstay even one day; penalties can include fines, entry bans and a record.","Ask the immigration authority ({r}) about an extension before it expires. In Schengen, extensions are only for exceptional cases like illness or cancelled flights.","If you can't extend, book your departure before the last day and keep proof of exit such as your boarding pass.","If you're stuck by illness or a cancelled flight, contact immigration before expiry with proof."]],
 ["I'm stopped or detained by police",["Stay calm and polite, don't resist, and never offer money; bribery is a crime.","Show your passport or ID when asked.","You have the right to contact your embassy and to ask for an interpreter and a lawyer.","Don't sign anything in a language you don't understand."]],
 ["I've had a car accident",["Stop, switch on hazard lights, place the warning triangle, and call emergency ({n}) if anyone is hurt.","Call the police. In some countries minor accidents are reported through an official app.","Photograph the scene and vehicles, and exchange names, plate numbers and insurance details.","Tell the rental company or insurer at once, and don't admit fault in writing before you understand what you sign."]]]},
fr:{title:"Que faire si… ?",emb:"Trouver votre ambassade ici",embNote:"Recherche l'ambassade de votre nationalité dans ce pays, avec adresse et téléphone. Enregistrez son numéro à l'avance.",s:[
 ["J'ai perdu mon passeport ou on me l'a volé",["Déclarez-le à la police ({n}) et demandez un récépissé écrit ; l'ambassade et l'assureur en auront besoin.","Contactez votre ambassade pour un nouveau passeport ou un document de voyage d'urgence ; apportez photos, copie du passeport et récépissé.","Si votre visa ou titre de séjour était dans ce passeport, adressez-vous au service d'immigration ({r}) pour le transférer ou obtenir une autorisation de sortie.","Conseil : gardez des photos de votre passeport et visa sur votre téléphone et dans vos e-mails."]],
 ["Mon séjour autorisé se termine",["Ne dépassez pas, même d'un jour ; amendes, interdiction d'entrée et inscription au dossier sont possibles.","Demandez une prolongation au service d'immigration ({r}) avant l'échéance. Dans Schengen, seulement en cas exceptionnel (maladie, vols annulés).","Sans prolongation, réservez votre départ avant le dernier jour et gardez une preuve de sortie (carte d'embarquement).","Si vous êtes bloqué (maladie, vol annulé), contactez l'immigration avant l'échéance avec des justificatifs."]],
 ["La police m'arrête ou me retient",["Restez calme et poli, ne résistez pas et n'offrez jamais d'argent ; la corruption est un délit.","Présentez votre passeport ou pièce d'identité sur demande.","Vous avez le droit de contacter votre ambassade et de demander un interprète et un avocat.","Ne signez rien dans une langue que vous ne comprenez pas."]],
 ["J'ai eu un accident de voiture",["Arrêtez-vous, allumez les feux de détresse, posez le triangle et appelez les urgences ({n}) en cas de blessés.","Appelez la police. Dans certains pays, les accidents légers se déclarent via une appli officielle.","Photographiez les lieux et les véhicules, échangez noms, immatriculations et assurances.","Prévenez tout de suite le loueur ou l'assureur, et ne reconnaissez pas de faute par écrit sans comprendre ce que vous signez."]]]},
de:{title:"Was tun, wenn …?",emb:"Ihre Botschaft hier finden",embNote:"Sucht die Botschaft Ihres Landes in diesem Staat, mit Adresse und Telefon. Nummer vorab speichern.",s:[
 ["Mein Pass ist verloren oder gestohlen",["Bei der Polizei ({n}) melden und eine schriftliche Anzeige verlangen; Botschaft und Versicherung brauchen sie.","Botschaft für neuen Pass oder Notreisedokument kontaktieren; Fotos, Passkopie und Anzeige mitbringen.","War Visum oder Aufenthaltstitel im verlorenen Pass, zur Einwanderungsbehörde ({r}) gehen, um ihn zu übertragen oder eine Ausreiseerlaubnis zu erhalten.","Tipp: Fotos von Pass und Visum im Handy und per E-Mail speichern."]],
 ["Mein erlaubter Aufenthalt endet",["Nicht einmal einen Tag überziehen; Bußgeld, Einreisesperre und Eintrag sind möglich.","Vor Ablauf bei der Einwanderungsbehörde ({r}) nach Verlängerung fragen. Im Schengen-Raum nur in Ausnahmefällen wie Krankheit oder Flugausfall.","Ohne Verlängerung die Ausreise vor dem letzten Tag buchen und einen Ausreisenachweis (Bordkarte) aufbewahren.","Bei Krankheit oder Flugausfall vor Ablauf mit Nachweisen zur Einwanderungsbehörde."]],
 ["Die Polizei hält mich an oder fest",["Ruhig und höflich bleiben, keinen Widerstand leisten und nie Geld anbieten; Bestechung ist strafbar.","Pass oder Ausweis auf Verlangen zeigen.","Sie haben das Recht, Ihre Botschaft zu kontaktieren und einen Dolmetscher und Anwalt zu verlangen.","Nichts in einer Sprache unterschreiben, die Sie nicht verstehen."]],
 ["Ich hatte einen Autounfall",["Anhalten, Warnblinker an, Warndreieck aufstellen und bei Verletzten den Notruf ({n}) wählen.","Polizei rufen. In manchen Ländern werden kleine Unfälle über eine offizielle App gemeldet.","Unfallstelle und Fahrzeuge fotografieren, Namen, Kennzeichen und Versicherung austauschen.","Vermieter oder Versicherung sofort informieren und keine Schuld schriftlich anerkennen, ohne zu verstehen, was Sie unterschreiben."]]]}};

 TRIPS=JSON.parse(localStorage.getItem("ub_trips")||"[]");DATES=JSON.parse(localStorage.getItem("ub_dates")||"[]");VIEW=localStorage.getItem("ub_view")||"countries"}catch(e){}
if(!LANGS.includes(lang)) lang="ar"; if(!C.find(c=>c.id===sel)) sel="gb";

/* ---------- Official application links ---------- */
const APL={eta:q("اطلب التصريح الإلكتروني","Apply for the travel authorisation","Demander l'autorisation de voyage","Reisegenehmigung beantragen"),
 ev:q("اطلب الفيزا الإلكترونية","Apply for the e-Visa","Demander l'e-Visa","E-Visum beantragen"),
 visa:q("ابدأ طلب الفيزا","Start your visa application","Commencer la demande de visa","Visumantrag starten"),
 check:q("تحقق من الشروط الرسمية","Check the official rules","Vérifier les règles officielles","Offizielle Regeln prüfen"),
 mdac:q("عبّئ بطاقة الوصول MDAC","Fill in the MDAC arrival card","Remplir la carte d'arrivée MDAC","MDAC-Ankunftskarte ausfüllen"),
 tdac:q("عبّئ بطاقة الوصول TDAC","Fill in the TDAC arrival card","Remplir la carte d'arrivée TDAC","TDAC-Ankunftskarte ausfüllen"),
 note:q("رابط رسمي · لا تدفع لأي موقع وسيط","Official link · never pay a middleman site","Lien officiel · ne payez jamais un site intermédiaire","Offizieller Link · nie über Vermittlerseiten zahlen")};
function applyLink(c,st){
 const a=AP[c.id]||{}; let k=null,u=null;
 if(st==="eta"){k="eta";u=a.eta}
 else if(["evisa","voa","cond"].includes(st)){k="ev";u=a.ev||a.visa}
 else if(st==="visa"){k="visa";u=a.visa}
 else if(st==="check"){k="check";u=(a.ev||a.visa||(c.entrySrc&&c.entrySrc.u))}
 else if(st==="vf"&&a.card){k=a.cardK;u=a.card}
 if(!u) return "";
 const host=u.replace(/^https?:\/\/(www\.)?/,"").split("/")[0];
 return `<a class="apply" href="${u}" target="_blank" rel="noopener">${esc(L(APL[k]))}<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a><div class="applynote">${esc(L(APL.note))} · <bdi dir="ltr">${esc(host)}</bdi></div>`;
}
/* ---------- Countries view ---------- */
const CL=q("اختر الدولة","Choose a country","Choisissez un pays","Land wählen");
function stamps(){
 $("countryL").textContent=L(CL);
 $("countrySel").innerHTML=REG.map(([g,ids])=>`<optgroup label="${esc(L(g))}">`+ids.map(id=>{const c=C.find(x=>x.id===id),s=ST[status(id)[0]];return `<option value="${id}"${id===sel?" selected":""}>${esc(L(c.n))} · ${esc(L(s[1]))}</option>`}).join("")+"</optgroup>").join("");
}
const IC={entry:'<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M9 16h6"/>',
 res:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
 money:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
 drive:'<path d="M4 13l2-6h12l2 6v4H4zM6 17v2M18 17v2"/><circle cx="8" cy="14" r="1"/><circle cx="16" cy="14" r="1"/>',
 laws:'<path d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/>',
 warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
 sos:'<path d="M5 4h4l2 5-3 2a11 11 0 0 0 5 5l2-3 5 2v4a1 1 0 0 1-1 1A17 17 0 0 1 4 5a1 1 0 0 1 1-1z"/>',
 help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/>'};
const svgI=k=>`<svg class="i" viewBox="0 0 24 24">${IC[k]}</svg>`;
const sec=(k,t,body,extra="")=>`<section class="card ${extra}"><div class="h"><span class="ic">${svgI(k)}</span><h3>${t}</h3></div>${body}</section>`;
function mineCard(c){
 const r=status(c.id), s=ST[r[0]], t=UI[lang], natName=L(NAT.find(x=>x[0]===nat)[1]);
 let h=`<section class="mine st-${s[0]}"><h3>${t.you} · ${esc(natName)}</h3><span class="stamp">${esc(L(s[1]))}</span>`;
 if(r[1]) h+=`<div>${esc(L(r[1]))}</div>`;
 if(pur!=="tour"&&!["home","free","ban"].includes(r[0])) h+=`<div><b>${t.purpose}:</b> ${esc(L(PURNOTE[pur]))}</div>`;
 if(r[0]!=="home") h+=`<div class="conf${r[2]?"":" ck"}">${r[2]?t.verified:t.unverified}</div>`;
 h+=applyLink(c,r[0]);
 return h+"</section>";
}
const flag=cc=>String.fromCodePoint(...[...cc].map(ch=>0x1F1E6+ch.charCodeAt(0)-65));
function guide(){
 const c=C.find(x=>x.id===sel)||C[0], t=UI[lang];
 $("guide").innerHTML=`<div class="hero"><div class="row"><span class="flag" aria-hidden="true">${flag(c.code)}</span><h2>${esc(L(c.n))}</h2></div>
  <div class="facts"><span class="chip">${t.cur}: <b>${c.cur}</b></span><span class="chip">${t.side} ${t[c.side]}</span></div>

  ${sec("entry",t.entry,list(L(c.entry))+src(c.entrySrc))}
  ${sec("res",t.res,list(L(c.res))+src(c.resSrc))}

  ${sec("warn",t.warn,list(L(c.warn)),"warn")}
  ${sec("sos",t.sos,`<div class="sos">${c.sos.map(s=>`<div><span>${esc(L(s[0]))}</span><b>${s[1]}</b></div>`).join("")}</div>`)}
  ${helpSec(c)}`;
}

/* ---------- Trips & dates ---------- */
const DAY=864e5;
const toD=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)};
const todayD=()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())};
const addM=(t,m)=>{const d=new Date(t);d.setUTCMonth(d.getUTCMonth()+m);return d.getTime()};
function nd(n,dat){n=Math.abs(n);if(lang==="ar")return n===1?"يوم واحد":n===2?(dat?"يومين":"يومان"):n>=3&&n<=10?n+" أيام":n+" يوماً";if(lang==="de")return n+" "+(n===1?"Tag":dat?"Tagen":"Tage");if(lang==="fr")return n+" "+(n===1?"jour":"jours");return n+" "+(n===1?"day":"days")}
const fmt=t=>new Date(t).toLocaleDateString(LOCALE[lang],{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"});
const uid=()=>Math.random().toString(36).slice(2,9);
function ppRule(dk){return dk==="sch"?"sch":dk==="tr"?"tr":SIX.includes(dk)?"six":"stay"}
function passportReq(dk,s,e){const r=ppRule(dk);return r==="sch"?addM(e,3):r==="tr"?s+150*DAY:r==="six"?addM(s,6):e}
function checklist(tr){
 const T=T2[lang], c=C.find(x=>x.id===tr.c), dk=destKey(tr.c), r=status(tr.c), s=toD(tr.s), e=toD(tr.e), out=[], away=r[0]!=="home";
 const pp=DATES.filter(d=>d.t==="passport").map(d=>toD(d.d)).sort((a,b)=>a-b)[0];
 const bad=pp!=null&&pp<passportReq(dk,s,e);
 out.push(["pass",UI[lang].ppLabel+T.pp[ppRule(dk)]+". "+(pp==null?T.ppUnknown:bad?T.ppBad:T.ppOk),bad]);
 if(away) out.push(["entry",T.e[r[0]]||T.e.check, r[0]==="ban"]);
 if(away&&r[0]!=="free"&&r[0]!=="ban") out.push(["ins", dk==="ge"?T.insGe:(dk==="sch"&&r[0]==="visa")?T.insS:T.ins]);
 if(dk==="my"&&away) out.push(["mdac",T.mdac]); if(dk==="th"&&away) out.push(["tdac",T.tdac]); if(dk==="id"&&away) out.push(["aiac",T.aiac]);
 if(away) out.push(["tix",T.tix]);
 if(away) out.push(["cash",T.cash+" "+L(c.money)[0]]);
 if(tr.drive){out.push(["lic",T.lic]); const dr=L(c.drive); out.push(["drv",dr[dr.length-1]])}
 if(["ae","sa","qa","kw","th","id"].includes(dk)) out.push(["meds",T.meds]);
 if(pur!=="tour"&&away&&!["free","ban"].includes(r[0])) out.push(["pur",L(PURNOTE[pur])]);
 out.push(["sos",T.sos+" "+c.sos.map(x=>x[1]).join(" · ")]);
 return out;
}
/* ---------- Stay counter logic ---------- */
let STAY={c:"",s:"",x:""};
try{STAY=Object.assign(STAY,JSON.parse(localStorage.getItem("ub_stay")||"{}"))}catch(e){}
function stayCalc(){
 if(!STAY.s) return {msg:"stayEmpty"};
 const c=C.find(x=>x.id===STAY.c)||C[0], r=status(c.id), today=todayD(), s=toD(STAY.s);
 if(s>today) return {msg:"stayFuture"};
 if(["home","free"].includes(r[0])&&!STAY.x) return {msg:"stayFree"};
 const allowed=["home","free"].includes(r[0])?null:(DAYS.get(r[1])||null), sch=destKey(c.id)==="sch"&&allowed===90;
 let last=null, used=Math.round((today-s)/DAY)+1;
 if(sch){
  const w0=today-179*DAY; let u=Math.round((today-Math.max(s,w0))/DAY)+1;
  TRIPS.forEach(tr=>{if(destKey(tr.c)!=="sch")return;const a=Math.max(toD(tr.s),w0),b=Math.min(toD(tr.e),s-DAY,today);if(b>=a)u+=Math.round((b-a)/DAY)+1});
  used=u; last=today+(90-u)*DAY;
 } else if(allowed) last=s+(allowed-1)*DAY;
 if(STAY.x){const x=toD(STAY.x); if(last==null||x<last) last=x}
 if(last==null) return {msg:"stayNeedX"};
 return {c,last,used,rem:Math.round((last-today)/DAY),sch};
}
function stayView(){
 const T=T2[lang], k=stayCalc();
 if(k.msg){$("stayOut").innerHTML=`<div class="meta">${T[k.msg]}</div>`;return}
 const cls=k.rem<0?"no":k.rem<=14?"cau":"ok";
 const head=k.rem<0?`${T.stayOver} ${nd(k.rem,1)}`:k.rem===0?T.stayToday:(lang==="ar"?`${T.left} ${nd(k.rem)}`:`${nd(k.rem)} ${T.left}`);
 $("stayOut").innerHTML=`<div class="stayres st-${cls}"><div class="days">${k.rem<0?"!":k.rem}</div><div class="sh">${esc(head)}</div>
  <div class="meta">${T.stayLast} <b>${fmt(k.last)}</b> · ${T.stayUsed} ${nd(k.used)}</div>
  ${k.sch?`<div class="meta">${T.staySch}</div>`:""}<div class="meta">${T.stayNote}</div>
  <button type="button" class="ghost del" id="st_clear">${T.stayClear}</button></div>`;
}
function helpSec(c){
 const H3=HELP[lang], n=c.sos[0][1], r=c.resSrc?c.resSrc.t:"", natE=NAT.find(x=>x[0]===nat);
 const nm=["xx","eu"].includes(nat)?"":natE[1].en+" ";
 const qy=encodeURIComponent(`Embassy of ${nm}in ${c.n.en}`.replace("Embassy of in","Embassies in"));
 const emb=nat===c.id?"":`<a class="apply" href="https://www.google.com/search?q=${qy}" target="_blank" rel="noopener">${esc(H3.emb)}<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a><div class="applynote">${esc(H3.embNote)}</div>`;
 const det=H3.s.map(([t,st])=>`<details class="whatif"><summary>${esc(t)}</summary><ol>${st.map(x=>"<li>"+esc(x).replace("{n}",`<bdi dir="ltr">${esc(n)}</bdi>`).replace("{r}",`<bdi dir="ltr">${esc(r)}</bdi>`)+"</li>").join("")}</ol></details>`).join("");
 return sec("help",esc(H3.title),emb+det);
}
function rel(t){const T=T2[lang],d=Math.round((t-todayD())/DAY);if(d===0)return T.today;if(d>0)return `${T.inDays} ${nd(d,1)}`;return lang==="en"?`${nd(d)} ${T.ago}`:`${T.ago} ${nd(d,1)}`}
function tripsView(){
 const T=T2[lang];
 if(!TRIPS.length){$("tripList").innerHTML=`<div class="emptyv">${T.noTrips}</div>`;return}
 $("tripList").innerHTML=[...TRIPS].sort((a,b)=>toD(a.s)-toD(b.s)).map(tr=>{
  const c=C.find(x=>x.id===tr.c); if(!c) return "";
  const items=checklist(tr), done=items.filter(i=>tr.done&&tr.done[i[0]]).length, s=toD(tr.s), e=toD(tr.e), len=Math.round((e-s)/DAY)+1, r=status(tr.c), st=ST[r[0]];
  const over=len>90&&!["home","free"].includes(r[0])?`<div class="note">${T.over90}</div>`:"";
  return `<article class="item st-${st[0]}"><div class="hd"><h3>${esc(L(c.n))}</h3><span class="pill">${esc(L(st[1]))}</span></div>
   <div class="meta">${fmt(s)} → ${fmt(e)} · ${T.stay} ${nd(len)} · ${rel(s)}</div>${over}
   <div class="progress" aria-hidden="true"><i style="width:${Math.round(done/items.length*100)}%"></i></div>
   <ul class="todo">${items.map(i=>`<li><label><input type="checkbox" data-trip="${tr.id}" data-k="${i[0]}" ${tr.done&&tr.done[i[0]]?"checked":""}><span${i[2]?' style="color:var(--no);font-weight:600"':""}>${esc(i[1])}</span></label></li>`).join("")}</ul>
   <div class="row-btns"><button type="button" class="ghost del" data-deltrip="${tr.id}">${T.del}</button></div></article>`}).join("");
}
const dateCls=t=>{const d=(t-todayD())/DAY;return d<30?"no":d<90?"cau":"ok"};
function datesView(){
 const T=T2[lang];
 if(!DATES.length){$("dateList").innerHTML=`<div class="emptyv">${T.noDates}</div>`;return}
 $("dateList").innerHTML=[...DATES].sort((a,b)=>toD(a.d)-toD(b.d)).map(d=>{
  const t=toD(d.d), n=Math.round((t-todayD())/DAY);
  return `<article class="item st-${dateCls(t)}"><div class="hd"><h3>${T.types[d.t]}${d.n?" · "+esc(d.n):""}</h3><span class="days">${Math.abs(n)}</span></div>
   <div class="meta">${n<0?T.expired+" "+nd(n,1):lang==="ar"?T.left+" "+nd(n):nd(n)+" "+T.left} · ${fmt(t)}</div>
   <div class="row-btns"><button type="button" class="ghost" data-ics="${d.id}" title="${T.calNote}">${T.cal}</button><button type="button" class="ghost del" data-deldate="${d.id}">${T.del}</button></div></article>`}).join("");
}
function alertsView(){
 const T=T2[lang], out=[], now=todayD();
 DATES.forEach(d=>{const t=toD(d.d),n=Math.round((t-now)/DAY),nm=T.types[d.t]+(d.n?" ("+esc(d.n)+")":""); if(n<=60) out.push([n<30?"no":"cau", n<0?`${T.docExp} ${nm}`:`${nm} ${T.docSoon} ${rel(t)}`])});
 TRIPS.forEach(tr=>{const c=C.find(x=>x.id===tr.c); if(!c) return; const s=toD(tr.s),n=(s-now)/DAY,items=checklist(tr),done=items.filter(i=>tr.done&&tr.done[i[0]]).length;
  if(n>=0&&n<=14&&done<items.length) out.push(["cau",`${T.soon} ${esc(L(c.n))} ${rel(s)} ${T.soonTail} (${done}/${items.length})`])});
 {const k=stayCalc(); if(k.last!=null&&k.rem<=7) out.push([k.rem<0?"no":"cau",k.rem<0?`${T.stayAlert}: ${esc(L(k.c.n))} · ${T.stayOver} ${nd(k.rem,1)}!`:`${T.stayAlert}: ${esc(L(k.c.n))} · ${T.stayLast} ${fmt(k.last)} (${rel(k.last)})`])}
 $("alerts").innerHTML=out.map(a=>`<div class="alert st-${a[0]}">${a[1]}</div>`).join("");
}
function ics(d){
 const T=T2[lang], t=toD(d.d)-30*DAY, f=x=>new Date(x).toISOString().slice(0,10).replace(/-/g,"");
 const title=`${T.types[d.t]}${d.n?" ("+d.n+")":""} ${T.docSoon} ${fmt(toD(d.d))}`;
 if(window.claude){const g="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(title)+"&dates="+f(t)+"/"+f(t+DAY);const a=document.createElement("a");a.href=g;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();return}
 const body=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Border Companion//EN","BEGIN:VEVENT",`UID:${d.id}@bordercompanion`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z`,`DTSTART;VALUE=DATE:${f(t)}`,`DTEND;VALUE=DATE:${f(t+DAY)}`,`SUMMARY:${title}`,"BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${title}`,"TRIGGER:PT9H","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
 const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([body],{type:"text/calendar"})); a.download="border-companion-reminder.ics"; document.body.appendChild(a); a.click(); a.remove();
}
function setView(v){VIEW=v;store("ub_view",v);["countries","trips","dates"].forEach(x=>{$("v-"+x).hidden=x!==v;$("t_"+x).setAttribute("aria-selected",x===v)})}
const refresh=()=>{stayView();tripsView();datesView();alertsView()};
const opts=(arr,v)=>arr.map(x=>`<option value="${x[0]}"${x[0]===v?" selected":""}>${esc(L(x[1]))}</option>`).join("");

/* ---------- Render ---------- */
function render(){
 const t=UI[lang], T=T2[lang];
 document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 $("langSel").value=lang; $("appName").textContent=t.name; $("tagline").textContent=t.tag;
 $("disclaimer").textContent=t.disc; $("privacy").textContent=L(PRIV);
 {const B=BK[lang]; $("bk_t").textContent=B.t; $("bk_i").textContent=B.i; $("bk_ex").textContent=B.ex; $("bk_im").textContent=B.im; $("bk_msg").textContent="";}
 $("natL").textContent=t.nat; $("purL").textContent=t.purpose; $("holdL").textContent=t.holds;
 $("h_visaL").textContent=t.hVisa; $("h_wresL").textContent=t.hWres; $("h_gccL").textContent=t.hGcc;
 $("nat").innerHTML=opts(NAT,nat); $("purpose").innerHTML=opts(PUR,pur);
 $("h_visa").checked=H.visa; $("h_wres").checked=H.wres; $("h_gcc").checked=H.gcc;

 ["countries","trips","dates"].forEach(x=>$("t_"+x).querySelector("span").textContent=T[x]);
 $("tr_cL").textContent=T.dest; $("tr_driveL").textContent=T.drive; $("tr_sL").textContent=T.from; $("tr_eL").textContent=T.to; $("tr_add").textContent=T.addTrip;
 const cv=$("tr_c").value; $("tr_c").innerHTML=C.map(c=>[c.id,c.n]).map(x=>`<option value="${x[0]}">${esc(L(x[1]))}</option>`).join(""); if(cv) $("tr_c").value=cv;
 $("st_t").textContent=T.stayT; $("st_i").textContent=T.stayI; $("st_cL").textContent=T.stayC; $("st_sL").textContent=T.stayS; $("st_xL").textContent=T.stayX;
 $("st_c").innerHTML=C.map(c=>`<option value="${c.id}">${esc(L(c.n))}</option>`).join(""); $("st_c").value=STAY.c||sel; $("st_s").value=STAY.s; $("st_x").value=STAY.x;
 $("d_tL").textContent=T.type; $("d_nL").textContent=T.label; $("d_n").placeholder=T.ph; $("d_dL").textContent=T.exp; $("d_add").textContent=T.addDate;
 const tv=$("d_t").value; $("d_t").innerHTML=Object.entries(T.types).map(([k,v])=>`<option value="${k}">${v}</option>`).join(""); if(tv) $("d_t").value=tv;
 stamps(); guide(); refresh(); setView(VIEW);
}
const EDIT=q("تعديل","Edit","Modifier","Ändern");
const profChanged=()=>{saveProf();stamps();guide();refresh()};
$("langSel").onchange=e=>{lang=e.target.value;store("ub_lang",lang);render()};
$("countrySel").onchange=e=>{sel=e.target.value;store("ub_sel",sel);guide()};
$("nat").onchange=e=>{nat=e.target.value;profChanged()};
$("purpose").onchange=e=>{pur=e.target.value;profChanged()};
[["h_visa","visa"],["h_wres","wres"],["h_gcc","gcc"]].forEach(([id,k])=>$(id).onchange=e=>{H[k]=e.target.checked;profChanged()});
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("[data-v]");if(b){setView(b.dataset.v);try{window.scrollTo(0,0)}catch(_){}}};
$("tripForm").onsubmit=e=>{e.preventDefault();const s=$("tr_s").value,en=$("tr_e").value;if(!s||!en)return;
 TRIPS.push({id:uid(),c:$("tr_c").value,s,e:en<s?s:en,drive:$("tr_drive").checked,done:{}});saveT();e.target.reset();refresh()};
$("dateForm").onsubmit=e=>{e.preventDefault();const d=$("d_d").value;if(!d)return;
 DATES.push({id:uid(),t:$("d_t").value,n:$("d_n").value.trim(),d});saveT();e.target.reset();refresh()};
$("tripList").onchange=e=>{const i=e.target;if(!i.dataset.trip)return;const tr=TRIPS.find(x=>x.id===i.dataset.trip);tr.done=tr.done||{};tr.done[i.dataset.k]=i.checked;saveT();refresh()};
$("tripList").onclick=e=>{const b=e.target.closest("[data-deltrip]");if(b){TRIPS=TRIPS.filter(x=>x.id!==b.dataset.deltrip);saveT();refresh()}};
$("dateList").onclick=e=>{const b=e.target.closest("[data-deldate]");if(b){DATES=DATES.filter(x=>x.id!==b.dataset.deldate);saveT();refresh();return}
 const c=e.target.closest("[data-ics]");if(c) ics(DATES.find(x=>x.id===c.dataset.ics))};
$("bk_ex").onclick=doExport;
$("bk_file").onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)doImport(f);e.target.value=""};
const stayChg=()=>{STAY={c:$("st_c").value,s:$("st_s").value,x:$("st_x").value};store("ub_stay",STAY);stayView();alertsView()};
["st_c","st_s","st_x"].forEach(id=>$(id).onchange=stayChg);
$("stayOut").onclick=e=>{if(e.target.id==="st_clear"){STAY={c:$("st_c").value,s:"",x:""};$("st_s").value="";$("st_x").value="";store("ub_stay",STAY);stayView();alertsView()}};
/* ---------- Privacy, backup, offline ---------- */
const PRIV=q("خصوصيتك: كل ما تُدخله (جنسيتك ورحلاتك ومواعيدك) يُحفظ في جوالك فقط، ولا يُرسل إلى أي خادم. الأزرار التي تفتح مواقع خارجية لا تنقل بياناتك.",
 "Your privacy: everything you enter (nationality, trips, dates) is stored only on your phone and never sent to any server. Buttons that open outside sites don't pass on your data.",
 "Confidentialité : tout ce que vous saisissez (nationalité, voyages, échéances) reste uniquement sur votre téléphone et n'est envoyé à aucun serveur. Les boutons vers des sites externes ne transmettent pas vos données.",
 "Datenschutz: Alles, was Sie eingeben (Nationalität, Reisen, Fristen), bleibt nur auf Ihrem Handy und wird an keinen Server gesendet. Buttons zu externen Seiten geben Ihre Daten nicht weiter.");
const BK={ar:{t:"نسخة احتياطية",i:"احفظ رحلاتك ومواعيدك في ملف، لتستعيدها إذا غيّرت جوالك أو مسحت بيانات المتصفح.",ex:"حفظ نسخة احتياطية",im:"استعادة من ملف",ok:"تمت الاستعادة بنجاح.",bad:"الملف غير صالح.",saved:"تم حفظ الملف.",no:"تعذّر حفظ الملف هنا."},
 en:{t:"Backup",i:"Save your trips and dates to a file so you can restore them on a new phone or after clearing browser data.",ex:"Save a backup",im:"Restore from file",ok:"Restored successfully.",bad:"This file isn't valid.",saved:"File saved.",no:"Couldn't save the file here."},
 fr:{t:"Sauvegarde",i:"Enregistrez vos voyages et échéances dans un fichier pour les restaurer sur un nouveau téléphone ou après avoir effacé les données du navigateur.",ex:"Enregistrer une sauvegarde",im:"Restaurer depuis un fichier",ok:"Restauration réussie.",bad:"Ce fichier n'est pas valide.",saved:"Fichier enregistré.",no:"Impossible d'enregistrer le fichier ici."},
 de:{t:"Sicherung",i:"Reisen und Fristen in einer Datei sichern, um sie auf einem neuen Handy oder nach dem Löschen der Browserdaten wiederherzustellen.",ex:"Sicherung speichern",im:"Aus Datei wiederherstellen",ok:"Erfolgreich wiederhergestellt.",bad:"Diese Datei ist ungültig.",saved:"Datei gespeichert.",no:"Datei konnte hier nicht gespeichert werden."}};
const bkMsg=(m,bad)=>{const el=$("bk_msg");el.textContent=m;el.style.color=bad?"var(--no)":"var(--ok)"};
async function doExport(){
 const B=BK[lang], data=JSON.stringify({app:"border-companion",v:1,saved:new Date().toISOString(),nat,pur,H,lang,TRIPS,DATES,STAY},null,1), name="border-companion-backup-"+new Date().toISOString().slice(0,10)+".json";
 try{
  if(window.claude&&window.claude.use){const d=await window.claude.use("downloads"); if(d){await d.save({filename:name,data}); bkMsg(B.saved); return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();bkMsg(B.saved);
 }catch(e){ if(!(e&&e.code==="declined")) bkMsg(B.no,true) }
}
function doImport(file){
 const B=BK[lang], fr=new FileReader();
 fr.onload=()=>{try{const o=JSON.parse(fr.result); if(!o||o.app!=="border-companion"||!Array.isArray(o.TRIPS)||!Array.isArray(o.DATES)) throw 0;
  TRIPS=o.TRIPS.filter(t=>t&&C.find(c=>c.id===t.c)&&/^\d{4}-\d\d-\d\d$/.test(t.s)&&/^\d{4}-\d\d-\d\d$/.test(t.e));
  DATES=o.DATES.filter(d=>d&&T2.en.types[d.t]&&/^\d{4}-\d\d-\d\d$/.test(d.d)).map(d=>({id:String(d.id||uid()),t:d.t,n:String(d.n||"").slice(0,40),d:d.d}));
  if(NAT.find(x=>x[0]===o.nat)) nat=o.nat; if(PUR.find(x=>x[0]===o.pur)) pur=o.pur; if(o.H) H={visa:!!o.H.visa,wres:!!o.H.wres,gcc:!!o.H.gcc};
  if(o.STAY&&typeof o.STAY==="object") STAY={c:String(o.STAY.c||""),s:String(o.STAY.s||""),x:String(o.STAY.x||"")};
  saveT();saveProf();store("ub_stay",STAY);render();bkMsg(BK[lang].ok)}catch(e){bkMsg(B.bad,true)}};
 fr.readAsText(file);
}
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !window.claude){
 window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
}
render();
</script>
</body></html>
